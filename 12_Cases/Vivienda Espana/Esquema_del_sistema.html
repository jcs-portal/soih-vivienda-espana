    const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
    const x1 = p.x + ux * (RN + 2), y1 = p.y + uy * (RN + 2), x2 = q.x - ux * (RN + 5), y2 = q.y - uy * (RN + 5);
    const k = 0.16, mx = (x1 + x2) / 2 - dy * k, my = (y1 + y2) / 2 + dx * k;
    const c = a.p === '+' ? MAS : MENOS;
    a.d = `M${x1},${y1} Q${mx},${my} ${x2},${y2}`;
    a.g = el('g', {}, gAr);
    a.halo = el('path', { d: a.d, fill: 'none', stroke: 'none', 'stroke-width': 11, 'stroke-linecap': 'round', 'stroke-opacity': .35 }, gHalo);
    el('path', { d: a.d, fill: 'none', stroke: c, 'stroke-width': 1.3 + a.c * 0.75, 'stroke-dasharray': a.c === 0 ? '2 5' : (a.q ? '9 4' : ''), 'marker-end': `url(#f-${a.p === '+' ? 'mas' : 'menos'})` }, a.g);
    // punto de la curva en t y su tangente
    const pt = t => [(1 - t) * (1 - t) * x1 + 2 * (1 - t) * t * mx + t * t * x2, (1 - t) * (1 - t) * y1 + 2 * (1 - t) * t * my + t * t * y2];
    const [sx, sy] = pt(0.80);
    const nx = -(y2 - my), ny = (x2 - mx), nn = Math.hypot(nx, ny) || 1;
    el('circle', { cx: sx + nx / nn * 11, cy: sy + ny / nn * 11, r: 8, fill: '#fff', stroke: c, 'stroke-width': 1 }, a.g);
    const s = el('text', { x: sx + nx / nn * 11, y: sy + ny / nn * 11 + 4.5, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 700, fill: c }, a.g); s.textContent = a.p === '+' ? '+' : '−';
    if (a.r === '1-3 años' || a.r === '>3 años') {
      const [tx, ty] = pt(0.5), [t2x, t2y] = pt(0.52), vx = t2x - tx, vy = t2y - ty, vn = Math.hypot(vx, vy) || 1, px = -vy / vn, py = vx / vn;
      const n = a.r === '>3 años' ? [-3.5, 3.5] : [0];
      n.forEach(o => el('line', { x1: tx + vx / vn * o - px * 7, y1: ty + vy / vn * o - py * 7, x2: tx + vx / vn * o + px * 7, y2: ty + vy / vn * o + py * 7, stroke: '#1F2933', 'stroke-width': 2 }, a.g));
    }
    const tt = el('title', {}, a.g); tt.textContent = `${nodo[a.de].n} → (${a.p}) ${nodo[a.a].n}\n${a.m}\nRetardo: ${a.r} · Confianza: ${CONF[a.c]} (${a.P}/${a.D})${a.q ? ' · disputada' : ''}`;
  });

  // Variables: circulo; decision = rombo; sintoma = doble anillo
  const partir = s => { if (s.length <= 24) return [s]; const m = s.length / 2; let b = -1; for (let i = 0; i < s.length; i++) if (s[i] === ' ' && (b < 0 || Math.abs(i - m) < Math.abs(b - m))) b = i; return b < 0 ? [s] : [s.slice(0, b), s.slice(b + 1)]; };
  DATOS.nodos.forEach(n => {
    n.g = el('g', {}, gNo);
    if (n.dec) el('rect', { x: n.x - RN, y: n.y - RN, width: RN * 2, height: RN * 2, transform: `rotate(45 ${n.x} ${n.y})`, fill: col[n.c], stroke: '#fff', 'stroke-width': 2 }, n.g);
    else { if (n.sint) el('circle', { cx: n.x, cy: n.y, r: RN + 5, fill: 'none', stroke: col[n.c], 'stroke-width': 2 }, n.g); el('circle', { cx: n.x, cy: n.y, r: RN, fill: col[n.c], stroke: '#fff', 'stroke-width': 2 }, n.g); }
    const lin = partir(n.n), arriba = n.y < 130 || n.up;
    lin.forEach((t, i) => {
      const y = arriba ? n.y - RN - 12 - (lin.length - 1 - i) * 15 : n.y + RN + 20 + i * 15;
      const bg = el('text', { x: n.x, y, 'text-anchor': 'middle', class: 'nom', stroke: '#fff', 'stroke-width': 4, 'stroke-linejoin': 'round' }, n.g); bg.textContent = t;
      const tx = el('text', { x: n.x, y, 'text-anchor': 'middle', class: 'nom', 'font-weight': (n.sint || n.dec) ? 700 : 400 }, n.g); tx.textContent = t;
    });
    const tt = el('title', {}, n.g); tt.textContent = `${n.n}\n${n.d}${n.du ? '\nLa decide: ' + n.du : ''}`;
  });

  // Leyenda
  const gl = el('g', { transform: 'translate(1150,22)' });
  el('rect', { x: -12, y: -14, width: 292, height: 134, fill: '#fff', stroke: '#CBD2D9', rx: 6 }, gl);
  const ley = [['line', MAS, 'Azul (+): si el origen sube, el destino sube'], ['line', MENOS, 'Naranja (−): si el origen sube, el destino baja'], ['dash', '#52606D', 'A trazos: relación disputada'], ['dot', '#52606D', 'Punteada: conjetura o hipótesis sin fuente'], ['ret', '#1F2933', 'Trazos cruzados: efecto con retardo de años'], ['rombo', '#52606D', 'Rombo: variable que decide un actor'], ['anillo', '#52606D', 'Doble anillo: síntoma']];
  ley.forEach((l, i) => {
    const y = i * 17;
    if (l[0] === 'rombo') el('rect', { x: 8, y: y - 5, width: 9, height: 9, transform: `rotate(45 12.5 ${y - 0.5})`, fill: l[1] }, gl);
    else if (l[0] === 'anillo') { el('circle', { cx: 12.5, cy: y - 1, r: 6.5, fill: 'none', stroke: l[1], 'stroke-width': 1.5 }, gl); el('circle', { cx: 12.5, cy: y - 1, r: 3.5, fill: l[1] }, gl); }
    else if (l[0] === 'ret') { el('line', { x1: 0, y1: y - 1, x2: 26, y2: y - 1, stroke: '#829AB1', 'stroke-width': 2 }, gl); [10, 15].forEach(x => el('line', { x1: x, y1: y - 7, x2: x, y2: y + 5, stroke: l[1], 'stroke-width': 2 }, gl)); }
    else el('line', { x1: 0, y1: y - 1, x2: 26, y2: y - 1, stroke: l[1], 'stroke-width': 2.5, 'stroke-dasharray': l[0] === 'dash' ? '7 3' : l[0] === 'dot' ? '2 4' : '' }, gl);
    const t = el('text', { x: 34, y: y + 3, 'font-size': 12, fill: '#1F2933' }, gl); t.textContent = l[2];
  });

  // Seleccion de arquetipo
  let activo = null;
  function pintar() {
    gEt.innerHTML = '';
    const A = DATOS.arquetipos.find(a => a.id === activo);
    const ar = new Map(), no = new Set();
    if (A) A.bucles.forEach((b, i) => { b.a.forEach(id => { if (!ar.has(id)) ar.set(id, i); }); b.n.forEach(id => no.add(id)); });
    DATOS.aristas.forEach(a => { a.g.classList.toggle('apagado', !!A && !ar.has(a.id)); a.halo.setAttribute('stroke', A && ar.has(a.id) ? COLB[ar.get(a.id) % COLB.length] : 'none'); });
    DATOS.nodos.forEach(n => n.g.classList.toggle('apagado', !!A && !no.has(n.id)));
    if (A) A.bucles.forEach((b, i) => {
      // etiqueta del bucle en el centro de sus variables, desplazada para que no se solapen
      // etiquetas de los bucles apiladas en la esquina superior izquierda: no tapan el dibujo
      const g = el('g', {}, gEt), c = COLB[i % COLB.length];
      const txt = `${b.t}${i + 1} · ${b.rol} · ${b.t === 'R' ? 'refuerzo' : 'equilibrio'}` + (b.ret ? ` · ≈ ${String(b.ret).replace('.', ',')} años` : '');
      el('rect', { x: 20, y: 18 + i * 36, width: txt.length * 7.6 + 46, height: 28, rx: 14, fill: '#fff', stroke: c, 'stroke-width': 2.5 }, g);
      el('line', { x1: 32, y1: 32 + i * 36, x2: 52, y2: 32 + i * 36, stroke: c, 'stroke-width': 9, 'stroke-opacity': .45, 'stroke-linecap': 'round' }, g);
      const t = el('text', { x: 60, y: 37 + i * 36, 'font-size': 14.5, 'font-weight': 700, fill: c }, g); t.textContent = txt;
    });
    document.getElementById('titulo').textContent = A ? `${A.id} · ${A.nombre}  —  arquetipo «${A.clase}» · ${A.apoyo.toUpperCase()}` : DATOS.titulo + ' · Esquema del sistema: variables clave, conexiones críticas y arquetipos';
    document.getElementById('sub').textContent = A ? A.explica : `${DATOS.nodos.length} variables clave y ${DATOS.aristas.length} relaciones: las que forman los ${DATOS.arquetipos.length} arquetipos identificados. Pulsa un arquetipo para ver sus bucles.`;
    lado.querySelectorAll('.carta').forEach(c => c.classList.toggle('activa', c.dataset.id === activo));
  }
  lado.innerHTML = '<h2>Arquetipos</h2>' + DATOS.arquetipos.map(a => `<div class="carta" data-id="${a.id}"><div class="clase">${esc(a.clase)}</div><b>${a.id} · ${esc(a.nombre)}</b>
    <p>${esc(a.explica)}</p>` + a.bucles.map((b, i) => `<div class="bucle" style="border-color:${COLB[i % COLB.length]}"><b style="color:${COLB[i % COLB.length]}">${b.t}${i + 1}</b> ${esc(b.rol)} · ${b.t === 'R' ? 'refuerzo' : 'equilibrio'} · ${b.ret === 0 ? 'inmediato' : '≈ ' + String(b.ret).replace('.', ',') + ' años'}<br>${b.n.map(id => esc(nodo[id].n)).join(' → ')}</div>`).join('') +
    `<p><span class="eti" style="color:${a.apoyo === 'Con apoyo' ? '#276749' : '#C05621'};border-color:${a.apoyo === 'Con apoyo' ? '#276749' : '#C05621'}"><b>${a.apoyo}</b></span><span class="eti">${a.cumple ? 'Estructura verificada' : 'Estructura no verificada'}</span></p>${a.dep.length ? '<p><i>Depende de hipótesis sin fuente:</i> ' + a.dep.map(esc).join('; ') + '</p>' : ''}<p><i>En duda:</i> ${esc(a.duda)}</p></div>`).join('') +
    '<p style="font-size:12.5px;color:#52606D">Pulsa de nuevo el arquetipo activo para volver a la vista completa. Pasa el ratón por una variable o una flecha para ver su definición o su mecanismo.</p>';
  lado.querySelectorAll('.carta').forEach(c => c.addEventListener('click', () => { activo = activo === c.dataset.id ? null : c.dataset.id; pintar(); }));
  activo = par.get('a') || null;
  pintar();
})();
</script>
</body>
