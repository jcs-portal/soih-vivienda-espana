<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOIH - Mapa causal N2</title>
<style>
  :root { --fondo:#F7F9FB; --tinta:#1F2933; --suave:#52606D; --linea:#CBD2D9; --panel:#FFFFFF; --mas:#2B6CB0; --menos:#C05621; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Calibri, "Segoe UI", Arial, sans-serif; color:var(--tinta); background:var(--fondo); }
  header { padding:10px 16px; background:#12355B; color:#fff; display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center; }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  header .ctrl { font-size:13px; display:flex; gap:6px; align-items:center; }
  header select, header input[type=text] { font:inherit; padding:3px 6px; border-radius:4px; border:1px solid #9FB3C8; }
  #cuerpo { display:flex; height:calc(100vh - 52px); }
  #lienzo { flex:1; min-width:0; background:var(--panel); cursor:grab; }
  #lado { width:360px; border-left:1px solid var(--linea); padding:12px 14px; overflow:auto; background:var(--panel); font-size:14px; }
  #lado h2 { font-size:16px; margin:0 0 4px; color:#12355B; }
  #lado h3 { font-size:13px; margin:14px 0 4px; color:var(--suave); text-transform:uppercase; letter-spacing:.04em; }
  #lado p { margin:0 0 6px; }
  .rel { padding:5px 0; border-bottom:1px solid #E4E7EB; cursor:pointer; }
  .rel:hover { background:#F0F4F8; }
  .mas { color:var(--mas); font-weight:700; } .menos { color:var(--menos); font-weight:700; }
  .eti { display:inline-block; font-size:11px; padding:1px 6px; border-radius:9px; border:1px solid var(--linea); color:var(--suave); margin-right:4px; }
  .leyenda { font-size:12px; color:var(--suave); line-height:1.5; }
  .leyenda i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; }
  text.nodo { font-size:10px; fill:var(--tinta); pointer-events:none; }
  text.clu { font-size:13px; font-weight:700; pointer-events:none; }
  .apagado { opacity:.08; }
  @media (max-width: 800px) { #cuerpo { flex-direction:column; height:auto; } #lienzo { height:70vh; } #lado { width:auto; border-left:0; border-top:1px solid var(--linea); } }
</style>
</head>

  </div>

  <div class="ctrl" id="cuenta"></div>
</header>

</div>

ectorial Inmobiliario 2S 2025 (leído en la fuente): una regresión simple entre provincias da +0,6 pp de precio al año por cada punto de déficit; con la medida más amplia de déficit explicaría hasta el 39 % de la subida. Es una correlación.","co":"Palomera, Gil, Gabarre y Jacinto niegan que falte vivienda: sostienen que está desviada o acaparada (S075, S076, S078, S080)."},{"id":"E011","de":"Q07","a":"Q08","p":"+","m":"La vivienda que se destina a segunda residencia no aloja hogares.","r":"inmediato","P":"P1","D":"D0","c":0,"h":0,"k":0,"q":0,"ev":"","co":"Solo lo afirma un actor. El dato que da (60.000 al año) son compraventas de no residentes, incluida segunda mano."},{"id":"E012","de":"D05","a":"D08","p":"+","m":"El empleo se va de los municipios pequeños y su población disminuye.","r":">3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E013","de":"Q08","a":"A02","p":"+","m":"Más hogares que viviendas: los inquilinos compiten y la renta sube.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":"Las afirmaciones recogidas hablan de «precios» o de la oferta de alquiler, no de este vínculo."},{"id":"E014","de":"R01","a":"O01","p":"-","m":"El esfuerzo es renta de alquiler dividida por ingresos.","r":"inmediato","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable.","co":""},{"id":"E015","de":"A02","a":"O01","p":"+","m":"El esfuerzo es renta de alquiler dividida por ingresos.","r":"inmediato","P":"P1","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable.","co":""},{"id":"E016","de":"R01","a":"O02","p":"-","m":"El esfuerzo de compra es precio dividido por ingresos.","r":"inmediato","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable.","co":""},{"id":"E017","de":"B01","a":"O02","p":"+","m":"El esfuerzo de compra es precio dividido por ingresos.","r":"inmediato","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable.","co":""},{"id":"E018","de":"F01","a":"O02","p":"+","m":"Con tipos más altos la misma hipoteca cuesta más cada mes.","r":"inmediato","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable en el esfuerzo teórico que calcula el Banco de España.","co":""},{"id":"E019","de":"B01","a":"B04","p":"+","m":"La entrada es un porcentaje del precio.","r":"inmediato","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable.","co":""},{"id":"E020","de":"O03","a":"D07","p":"+","m":"Cada año de retraso suma jóvenes que siguen en casa de sus padres.","r":"1-3 años","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Casi una identidad. Eurostat: los jóvenes de 25 a 34 años que viven con sus padres pasan del 38,9 % en 2007 al 50,2 % en 2025.","co":""},{"id":"E021","de":"R02","a":"O03","p":"-","m":"Con mejores salarios los jóvenes pueden irse antes.","r":"1-3 años","P":"P1","D":"D0","c":0,"h":0,"k":0,"q":0,"ev":"","co":"Solo lo afirma un actor. Consejo de la Juventud (1S 2024): la emancipación bajó 1,47 pp pese a una subida del 4,0 % del salario mediano joven."},{"id":"E022","de":"R05","a":"D03","p":"+","m":"Con un contrato estable se forma un hogar antes.","r":"1-3 años","P":"P1","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Barceló y Villanueva (Banco de España, DT 1849, 2018; solo leído el resumen): +1 % de trabajadores con contrato indefinido aumenta la probabilidad de formar un hogar nuevo en una magnitud similar, sobre todo alquilando.","co":"Ahn y Sánchez-Marcos (2015): la emancipación subió en plena recesión; no sigue mecánicamente al ciclo."},{"id":"E023","de":"O01","a":"O03","p":"+","m":"Si el alquiler se lleva casi todo el salario, emanciparse se retrasa.","r":"1-3 años","P":"P1","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Aparicio-Fenoll y Oppedisano (IZA DP 6651, leído completo): la Renta Básica de Emancipación de 2008 elevó la emancipación entre 0,9 y 2,3 pp y la convivencia en pareja entre 1,2 y 2,4 pp, comparando jóvenes de 22 años con los de 21.","co":"Identificado con una ayuda, no con una subida de precios; el efecto puede no ser simétrico."},{"id":"E024","de":"O01","a":"D03","p":"-","m":"El coste reprime la formación de hogares: se comparte piso o no se sale de casa.","r":"1-3 años","P":"P2","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Cagigas y Beraza (ICE 942, 2026, leído en la fuente): el déficit de hogares jóvenes no formados respecto a la tendencia de 2014 supera los 311.000 en 2024. Aparicio-Fenoll y Oppedisano: una ayuda al alquiler aumenta la salida del hogar familiar.","co":"No existe una elasticidad española de la formación de hogares respecto al alquiler. La proyección de hogares del INE no depende del coste de la vivienda."},{"id":"E025","de":"O01","a":"O06","p":"-","m":"Quien no puede pagar una vivienda propia retrasa o reduce los hijos.","r":">3 años","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Aparicio-Fenoll y Oppedisano: entre los jóvenes de 22 años ya emancipados, la ayuda al alquiler elevó entre 4,8 y 8,1 pp la probabilidad de tener al menos un hijo.","co":"El estudio mide el efecto de una ayuda sobre quienes ya se han emancipado. No se ha localizado ningún estudio español de precio o alquiler sobre fecundidad."},{"id":"E026","de":"O01","a":"O04","p":"+","m":"Cuando el alquiler no se puede pagar, llegan el impago, el desahucio o el hacinamiento.","r":"1-3 años","P":"P1","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"IX Informe FOESSA (2025).","co":""},{"id":"E027","de":"O01","a":"B03","p":"-","m":"Quien paga mucho de alquiler no puede ahorrar la entrada: la «trampa del alquiler».","r":">3 años","P":"P2","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Banco de España, Informe Anual 2023, recuadro 4.2 (modelo de ciclo vital calibrado a España): con menos esfuerzo en el alquiler, la proporción de propietarios mayores de 35 años sube 3,4 pp.","co":"Es un modelo; no hay estimación con datos de panel."},{"id":"E028","de":"O02","a":"A03","p":"+","m":"Quien no puede comprar se queda en el alquiler.","r":"1-3 años","P":"P2","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"INE, Encuesta de Condiciones de Vida: los hogares de 30 a 44 años en alquiler a precio de mercado pasan del 15,8 % en 2007 al 32,1 % en 2025.","co":"Dato compatible, no estimación."},{"id":"E029","de":"O02","a":"O03","p":"+","m":"Si comprar es inalcanzable, se sigue en casa de los padres.","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Banco de España, Informe Anual 2025 (leído en la fuente): los jóvenes no emancipados con ingresos necesitarían unos 8,3 años de renta neta para comprar; la cuota de compras de 18 a 35 años cayó cerca de 20 pp entre 2007 y 2025.","co":"Dato compatible; ningún estudio español separa con identificación causal el efecto de la vivienda del laboral."},{"id":"E030","de":"B04","a":"B03","p":"-","m":"Sin ahorro para la entrada no hay compra, aunque la cuota fuese asumible.","r":"meses","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Banco de España, Informe Anual 2023, cap. 4 (leído en la fuente): en 2021 el 61 % de los hogares en alquiler o cesión no tenía el ahorro necesario para comprar en su municipio. ICE 942 (2026): cerca del 50 % de los hogares en alquiler tardaría más de 30 años en reunirlo.","co":"Son simulaciones con microdatos; renta y riqueza están muy correlacionadas."},{"id":"E031","de":"R04","a":"B03","p":"+","m":"Con ayuda o herencia familiar se salva la barrera de la entrada.","r":"meses","P":"P3","D":"D1","c":2,"h":0,"k":0,"q":0,"ev":"Banco de España, Informe Anual 2025 (leído en la fuente): en 2025 hubo 30.500 donaciones de vivienda de padres a hijos (+61 % sobre 2019) y unos 5.500 millones de euros en donaciones dinerarias, el triple que en 2019.","co":"No estima cuántas compras dependen de ellas."},{"id":"E032","de":"B01","a":"R04","p":"+","m":"La revalorización enriquece a las familias que ya son propietarias.","r":">3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Fedea, «Evolución de la riqueza de las familias en España (2002-2022)»: los activos reales medios del grupo de 55 a 64 años subieron un 67,9 % entre 2002 y 2008.","co":"Dato compatible; nada mide cuánta revalorización se convierte en ayuda a los hijos."},{"id":"E033","de":"B01","a":"O05","p":"+","m":"Quien tiene vivienda gana patrimonio; quien no, lo pierde en términos relativos.","r":">3 años","P":"P2","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Fedea (EFF 2002-2022): la riqueza mediana de los menores de 35 años pasó de 101.040 € en 2008 a 23.500 € en 2022; la media de 65 a 74 años era de 425.838 €.","co":""},{"id":"E034","de":"O02","a":"M03","p":"-","m":"Si comprar es inalcanzable, cada generación tiene menos propietarios.","r":">3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"INE, Encuesta de Condiciones de Vida: los hogares en propiedad pasan del 80,1 % en 2007 al 73,3 % en 2025; entre los de 30 a 44 años, del 74,3 % al 53,1 %.","co":"Dato compatible, no estimación."},{"id":"E035","de":"A02","a":"O07","p":"-","m":"Si alquilar donde hay empleo es inasequible, no compensa mudarse.","r":"1-3 años","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Banco de España, Informe Anual 2025, recuadro 2.4 (leído en la fuente): un aumento del 1 % del alquiler real de una provincia reduce un 0,6 % los flujos de migración interna hacia ella.","co":"Primera estimación; mide flujos de residentes, no de trabajadores."},{"id":"E036","de":"R03","a":"R01","p":"+","m":"Más empleo, más ingresos en los hogares.","r":"meses","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E037","de":"F01","a":"B01","p":"-","m":"Con crédito más barato se puede pagar más por la misma vivienda.","r":"1-3 años","P":"P3","D":"D2","c":3,"h":0,"k":0,"q":0,"ev":"Jordà, Schularick y Taylor (2015), con España en la muestra; Aspachs-Bracons y Rabanal (2009).","co":"Banco de España (2025): con la subida de tipos de 2022 cayeron las compras financiadas, pero los precios no bajaron."},{"id":"E038","de":"F01","a":"F02","p":"-","m":"Crédito más barato, más hipotecas.","r":"meses","P":"P0","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Jordà, Schularick y Taylor (2015); Jiménez, Mian, Peydró y Saurina para España 2001-2009.","co":""},{"id":"E039","de":"F03","a":"F02","p":"-","m":"Criterios más duros, menos hipotecas concedidas.","r":"meses","P":"P1","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Akin et al. (2014): criterios laxos y tasaciones infladas durante la burbuja.","co":"Banco de España y AEB sostienen que hoy el crédito no es causa (S027, S063)."},{"id":"E040","de":"F02","a":"B03","p":"+","m":"El crédito convierte la intención de comprar en compra efectiva.","r":"meses","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Aspachs-Bracons y Rabanal (FMI, 2009): la caída de tipos al entrar en el euro, motor del auge.","co":""},{"id":"E041","de":"B03","a":"B01","p":"+","m":"Más compradores para las mismas viviendas.","r":"1-3 años","P":"P3","D":"D2","c":3,"h":0,"k":0,"q":0,"ev":"Jordà, Schularick y Taylor (2015); Aspachs-Bracons y Rabanal (2009).","co":"Sólido para 2000-2007; el Banco de España lo ve más débil en 2015-2025."},{"id":"E042","de":"F05","a":"B01","p":"+","m":"Los inversores pujan junto a quienes compran para vivir.","r":"1-3 años","P":"P3","D":"D1","c":2,"h":0,"k":0,"q":0,"ev":"Referencia de otro país: Sá (2025), Inglaterra y Gales: +1 pp en la cuota de compras de sociedades extranjeras → precios +2,1 a 2,3 %.","co":"Sin estudio español localizado."},{"id":"E043","de":"F06","a":"B01","p":"+","m":"Compradores con rentas de otros países pagan más por la misma vivienda.","r":"1-3 años","P":"P3","D":"D1","c":1,"h":0,"k":0,"q":1,"ev":"CaixaBank Research (leído en la fuente): los no residentes pagan 3.063 €/m² frente a 1.713 €/m² de los nacionales (2S 2024). Referencia de otro país: Hartley et al. (2022): los impuestos altos a compradores extranjeros en Toronto y Vancouver frenaron el crecimiento de los precios.","co":"Banco de España (Álvarez, Blanco y García-Posada, 2020, leído en la fuente): con 50 provincias, 2013-2019, no hay evidencia estadística de que la inversión de no residentes haya contribuido de forma significativa a la subida de precios."},{"id":"E044","de":"B01","a":"F04","p":"+","m":"Las subidas recientes se proyectan hacia el futuro.","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"García Montalvo (Funcas, 2026), encuesta de 2025: las expectativas siguen «patrones extrapolativos» y son superiores a las de 2005; el incremento de precios percibido (26,1 %) dobla el oficial (12,8 %). Referencia de otro país: Armona, Fuster y Zafar (2019), experimento en EE. UU.","co":"Es una encuesta descriptiva, no una estimación."},{"id":"E045","de":"F04","a":"F05","p":"+","m":"Si se espera que suba, comprar para invertir compensa.","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Referencia de otro país: Armona, Fuster y Zafar (2019): las expectativas afectan causalmente a la decisión de invertir en vivienda.","co":"Sin medición en España."},{"id":"E046","de":"A02","a":"F08","p":"+","m":"La rentabilidad es renta anual dividida por precio.","r":"inmediato","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable.","co":""},{"id":"E047","de":"B01","a":"F08","p":"-","m":"La rentabilidad es renta anual dividida por precio.","r":"inmediato","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable.","co":""},{"id":"E048","de":"F09","a":"F05","p":"+","m":"El capital internacional busca activos reales seguros.","r":"1-3 años","P":"P1","D":"D0","c":0,"h":0,"k":0,"q":0,"ev":"","co":"Solo lo afirma un actor."},{"id":"E049","de":"F05","a":"Q03","p":"+","m":"Quien compra esperando plusvalía puede preferir no alquilar.","r":"1-3 años","P":"P2","D":"D0","c":0,"h":0,"k":0,"q":1,"ev":"","co":"Tinsa: la mayor cuota de vivienda vacía está en el interior (S061)."},{"id":"E050","de":"F07","a":"A01","p":"+","m":"Los inversores profesionales promueven y gestionan vivienda de alquiler.","r":">3 años","P":"P3","D":"D1","c":2,"h":0,"k":0,"q":0,"ev":"Atlas Real Estate Analytics (consultora del sector; leído en la fuente): 15.710 viviendas de alquiler entregadas por promotores institucionales en 2019-2023, de ellas 9.361 en 2023.","co":"Los movimientos de vivienda sostienen que encarecen, no que amplían la oferta (S009, S035). Es poco frente a un parque de alquiler de millones."},{"id":"E051","de":"F10","a":"A08","p":"+","m":"Cada cartera que compra un fondo concentra más la oferta.","r":"1-3 años","P":"P1","D":"D0","c":0,"h":0,"k":0,"q":0,"ev":"","co":"Solo lo afirma un actor. Tres mediciones de la concentración no coinciden: Consumo-CSIC (dos o más viviendas alquiladas, 52,8 % entre particulares), Banco de España (más de diez viviendas, un máximo del 7 %) y Civio (737 grupos con el 10 % de los alquileres con fianza)."},{"id":"E052","de":"A08","a":"A02","p":"+","m":"Quien controla mucha oferta en una zona puede fijar precios por encima de la competencia.","r":"1-3 años","P":"P2","D":"D1","c":0,"h":0,"k":0,"q":1,"ev":"Referencia de otro país: Gurun et al. (2023), EE. UU.; Banco Central de Irlanda: los institucionales suben la renta 4,1 pp más tras la compra.","co":"Sin estudio español. El Banco de España sostiene el signo contrario: los arrendadores no profesionales tienen más costes y eso se traduce en precios más altos (Informe Anual 2023, pp. 283-284)."},{"id":"E053","de":"L07","a":"F07","p":"+","m":"Un trato fiscal favorable atrae capital a estos vehículos.","r":"1-3 años","P":"P3","D":"D1","c":2,"h":0,"k":0,"q":0,"ev":"Gil y Martínez (Housing, Theory and Society, 2023): la reforma de 2012-2013 dejó su impuesto de sociedades en el 0 % y redujo de siete a tres años el plazo mínimo de tenencia. Banco de España (Boletín Económico 3/2020): pasan de 2 en 2013 a 90 en 2019.","co":"Coincidencia temporal, sin estimación. La vivienda es solo el 11,2 % de sus activos y en torno al 1 % de las viviendas principales en alquiler (Banco de España, 2020). La norma no exige que el arrendamiento sea a residentes permanentes, y hay socimis especializadas en alquiler turístico (Cocola-Gant et al., 2025)."},{"id":"E054","de":"L10","a":"F07","p":"-","m":"Si las reglas cambian a menudo, el inversor de largo plazo se retira.","r":"1-3 años","P":"P2","D":"D0","c":1,"h":0,"k":0,"q":0,"ev":"","co":"No existe ninguna estimación española del efecto de la inestabilidad normativa sobre la inversión."},{"id":"E055","de":"F07","a":"P09","p":"+","m":"El capital institucional financia promociones que el promotor no puede pagar solo.","r":"1-3 años","P":"P1","D":"D0","c":0,"h":0,"k":0,"q":0,"ev":"","co":"Solo lo afirma un actor."},{"id":"E056","de":"F01","a":"F05","p":"-","m":"Con tipos bajos, la vivienda rinde más que los depósitos y la deuda.","r":"meses","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E057","de":"F09","a":"F07","p":"+","m":"El capital internacional entra a través de fondos y socimis.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E058","de":"F08","a":"F05","p":"+","m":"Cuanto más rinde alquilar, más compensa comprar para alquilar.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E059","de":"F08","a":"F07","p":"+","m":"La rentabilidad atrae capital profesional.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E060","de":"F05","a":"A01","p":"+","m":"Parte de lo que se compra para invertir se pone en alquiler.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E061","de":"S02","a":"S01","p":"-","m":"Cuanto más tarda la tramitación, menos suelo llega a estar listo.","r":">3 años","P":"P3","D":"D1","c":2,"h":0,"k":0,"q":0,"ev":"Ministerio de Vivienda, «Sectores Residenciales en España 2025» (leído en la fuente): de 1.069 grandes sectores, solo el 25,8 % tiene suelo urbanizado disponible y el 64,4 % no ha iniciado la urbanización. Banco de España, Informe Anual 2025: la lenta gestión urbanística da como resultado una baja ejecución de las viviendas previstas.","co":"Sin estimación del efecto. La cifra de «10 a 15 años» procede de un informe de Colliers y la patronal APCE apoyado en cuatro casos; lo único medido oficialmente son 18,5 años de media para completar la edificación de un sector."},{"id":"E062","de":"S01","a":"P01","p":"+","m":"Sin suelo listo no se puede iniciar obra.","r":"1-3 años","P":"P3","D":"D1","c":2,"h":0,"k":0,"q":0,"ev":"Banco de España, Informe Anual 2025 (leído en la fuente): la gestión urbanística y las políticas de suelo «emergen como un factor central» de la baja producción.","co":"Ezquiaga: hay suelo urbanizable que no se ejecuta (S068). El propio Ministerio cuenta 106.606 viviendas previstas en sectores ya urbanizados donde no se ha empezado a edificar."},{"id":"E063","de":"S01","a":"B01","p":"-","m":"Donde hay más suelo listo para edificar, los precios suben menos.","r":">3 años","P":"P1","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Banco de España, Informe Anual 2023, gráfico 4.11 (leído en la fuente): en los municipios de más de 50.000 habitantes, los precios de compra han crecido más donde hay menos suelo disponible.","co":"Es una correlación entre municipios, sin coeficiente publicado."},{"id":"E064","de":"S01","a":"A02","p":"-","m":"Donde hay más suelo listo para edificar, los alquileres suben menos.","r":">3 años","P":"P1","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Banco de España, Informe Anual 2023, gráfico 4.11: los alquileres también han crecido más donde hay menos suelo disponible.","co":"Es una correlación entre municipios."},{"id":"E065","de":"S05","a":"G02","p":"+","m":"La vivienda protegida necesita suelo barato o cedido.","r":">3 años","P":"P1","D":"D0","c":0,"h":0,"k":0,"q":0,"ev":"","co":"Solo lo afirma un actor."},{"id":"E066","de":"S02","a":"S03","p":"+","m":"El suelo clasificado se acumula sin transformar.","r":">3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Ministerio de Vivienda (2025): el 64,4 % de los grandes sectores residenciales no ha iniciado las obras de urbanización. Banco de España, Informe Anual 2025: el 71 % de los municipios no había modificado su plan general desde 2008.","co":"Dato compatible, no estimación."},{"id":"E067","de":"F04","a":"S03","p":"+","m":"Si se espera que el suelo valga más, compensa esperar para desarrollarlo.","r":"1-3 años","P":"P1","D":"D0","c":0,"h":0,"k":0,"q":0,"ev":"","co":"Solo lo afirma un actor. No hay ninguna medición de la retención de suelo."},{"id":"E068","de":"S06","a":"S02","p":"-","m":"Con reglas estables, los planes no se anulan ni se repiten.","r":">3 años","P":"P3","D":"D0","c":1,"h":0,"k":0,"q":0,"ev":"","co":"No hay serie de planes anulados; la cifra de 94 municipios afectados en 2023 es una cita de segunda mano."},{"id":"E069","de":"S01","a":"S04","p":"-","m":"Cuanto menos suelo listo hay, más caro es.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E070","de":"B01","a":"S04","p":"+","m":"El suelo vale lo que permite ganar la vivienda que se construye encima.","r":"1-3 años","P":"P1","D":"D0","c":0,"h":0,"k":0,"q":0,"ev":"","co":"Solo lo afirma un actor; no se ha abierto ningún estudio que lo estime."},{"id":"E071","de":"M03","a":"S01","p":"-","m":"Los propietarios, que son mayoría, tienden a oponerse a nuevos desarrollos cerca de su vivienda.","r":">3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":"Solé-Ollé y Viladecans-Marsal (2012) muestran que más competencia política local reduce el suelo nuevo clasificado, con más efecto donde hay muchos propietarios; los autores lo interpretan como presión de los promotores, no de los vecinos. No se ha localizado ningún estudio sobre oposición vecinal en España."},{"id":"E072","de":"B01","a":"P01","p":"+","m":"Con precios más altos compensa construir más.","r":"1-3 años","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Dos estimaciones de la OCDE que no coinciden: Caldera Sánchez y Johansson (WP 837, leído en la fuente) dan una elasticidad de largo plazo de 0,45, respuesta intermedia; Cavalleri, Cournède y Özsöğüt (2019, datos hasta 2017) dan 1,17.","co":"El Banco de España (Informe Anual 2025) considera estas cifras una cota superior de la respuesta actual. Contraejemplo descriptivo: hoy los precios superan los de 2007 y se inicia menos de la cuarta parte."},{"id":"E073","de":"P03","a":"P01","p":"-","m":"Con costes más altos se inician menos promociones.","r":"1-3 años","P":"P1","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Ministerio de Transportes: el índice de costes de construcción sube un 25 % entre 2019 y 2025. Banco de España, Informe Anual 2025: su componente residencial sube cerca de un 35 % entre principios de 2020 y finales de 2025.","co":"Sin estimación de cuánto reduce las viviendas iniciadas."},{"id":"E074","de":"P04","a":"P01","p":"+","m":"Sin trabajadores no se puede iniciar ni terminar obra.","r":"1-3 años","P":"P3","D":"D1","c":2,"h":0,"k":0,"q":0,"ev":"Banco de España, Informe Anual 2025 (leído en la fuente): el 63 % de las empresas del sector señala la falta de personal como factor limitante a finales de 2025; era el 55 % a finales de 2023 y cerca del 20 % a finales de 2020.","co":"Es encuesta de percepción; ningún estudio reparte la caída de la producción entre suelo, costes, mano de obra y financiación."},{"id":"E075","de":"P04","a":"P03","p":"-","m":"Cuando faltan trabajadores, suben los salarios del sector.","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Banco de España, Informe Anual 2023 (leído en la fuente): el coste laboral por trabajador en construcción subió un 11,2 % entre 2019 y 2023.","co":"Dato compatible, no estimación."},{"id":"E076","de":"P01","a":"P02","p":"+","m":"Lo que se inicia se termina unos dos años después.","r":"1-3 años","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable.","co":""},{"id":"E077","de":"P02","a":"A02","p":"-","m":"La vivienda nueva libera otras por cadenas de mudanzas y alivia el alquiler.","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Referencia de otro país: Auckland, seis años después de permitir más edificación, alquileres entre un 14 % y un 35 % inferiores al contrafactual (Greenaway-McGrevy, 2023). EE. UU.: los edificios nuevos bajan cerca de un 6 % los alquileres cercanos (Asquith, Mast y Reed, 2023).","co":"Sin estudio español. En Minneapolis la bajada no se debió a más oferta, según sus autores."},{"id":"E078","de":"P06","a":"P03","p":"+","m":"Cada requisito técnico añade coste por metro.","r":"1-3 años","P":"P1","D":"D0","c":0,"h":0,"k":0,"q":0,"ev":"","co":"Solo lo afirma un actor."},{"id":"E079","de":"P09","a":"P01","p":"+","m":"Sin capital no se puede comprar suelo ni empezar obra.","r":"1-3 años","P":"P3","D":"D1","c":2,"h":0,"k":0,"q":0,"ev":"Banco de España, Informe Anual 2025 (leído en la fuente): el crédito al sector equivale al 5,8 % del PIB en 2025, frente al 26 % en los años 2000; la rentabilidad de la construcción residencial fue del 8,7 % en 2024, unos 6 puntos menos que en 2004-2007.","co":"Dato compatible, no estimación."},{"id":"E080","de":"P03","a":"P10","p":"+","m":"Con costes altos solo sale rentable construir caro.","r":"1-3 años","P":"P1","D":"D0","c":0,"h":0,"k":0,"q":0,"ev":"","co":"Solo lo afirma un actor."},{"id":"E081","de":"F06","a":"P10","p":"+","m":"La demanda extranjera de renta alta orienta la promoción hacia ese segmento.","r":"1-3 años","P":"P1","D":"D0","c":0,"h":0,"k":0,"q":0,"ev":"","co":"Solo lo afirma un actor."},{"id":"E082","de":"P10","a":"B01","p":"+","m":"Si lo nuevo es caro, no alivia el precio del resto.","r":"1-3 años","P":"P1","D":"D0","c":0,"h":0,"k":0,"q":1,"ev":"","co":"Referencia de otro país: Mast (2023) y Asquith et al. (2023), EE. UU., encuentran lo contrario: la obra nueva cara libera vivienda más barata."},{"id":"E083","de":"L06","a":"B01","p":"+","m":"Los impuestos se trasladan al precio final.","r":"meses","P":"P2","D":"D0","c":1,"h":0,"k":0,"q":0,"ev":"","co":"Lo afirman solo fuentes del sector, con definiciones distintas de la carga. No se ha localizado ningún estudio español sobre la traslación de impuestos a precios."},{"id":"E084","de":"P08","a":"Q03","p":"-","m":"Rehabilitar devuelve al uso viviendas que no lo tenían.","r":"1-3 años","P":"P1","D":"D0","c":0,"h":0,"k":0,"q":0,"ev":"","co":"Solo lo afirma un actor."},{"id":"E085","de":"Q09","a":"Q03","p":"-","m":"Lo que está en mal estado o no se adapta se queda vacío.","r":">3 años","P":"P2","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Generalitat, Informe sobre el sector de l’habitatge 2024 (leído en la fuente): de 25.443 viviendas del registro de vacías, el 37 % está en condiciones de habitabilidad. Madrid, programa ReViVa (visto en prensa): las 200 viviendas captadas necesitaron obra.","co":""},{"id":"E086","de":"P05","a":"P03","p":"-","m":"Más producción por hora, menos coste por vivienda.","r":">3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Banco de España, Informe Anual 2025 (leído en la fuente): la producción por hora trabajada en la construcción cae un 13 % entre 2013 y 2025; el 95 % de las empresas de edificación residencial tiene menos de diez trabajadores.","co":"Dato compatible; no estima el paso de la productividad a los costes."},{"id":"E087","de":"D02","a":"P04","p":"+","m":"Parte de quienes llegan trabaja en la construcción.","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Ministerio de Inclusión (cierre de 2025, leído en la fuente): el 23,2 % de los afiliados del sector de la construcción son extranjeros. En agosto de 2026, el 27 % (mismo Ministerio), y el 27,4 % de los ocupados del sector según la EPA. Banco de España, Informe Anual 2025: el 63 % de las empresas de construcción y promoción dice que la falta de personal limita su actividad.","co":"Dato compatible, sin serie histórica ni estimación."},{"id":"E088","de":"L03","a":"Q05","p":"-","m":"Menos licencias, menos viviendas turísticas.","r":"1-3 años","P":"P1","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Gyódi et al. (2025), según la revisión de Hidalgo y Velázquez (Fedea, DT 2026-02, leída en la fuente): sin la regulación aplicada en Barcelona desde 2015, los anuncios casi se habrían duplicado. INE: las viviendas turísticas bajan de 376.463 a 329.764 entre noviembre de 2024 y noviembre de 2025.","co":"La misma revisión: la regulación evita más crecimiento, pero no revierte lo ya perdido, y los operadores con muchas viviendas la esquivan mejor. Apartur: la prohibición desplaza a la oferta ilegal (S085). El estudio original no se ha leído."},{"id":"E089","de":"Q05","a":"A02","p":"+","m":"Las viviendas que pasan a uso turístico dejan de alquilarse a residentes y la renta sube.","r":"1-3 años","P":"P3","D":"D3","c":2,"h":0,"k":0,"q":1,"ev":"Garcia-López, Jofre-Monseny, Martínez-Mazza y Segú (Journal of Urban Economics, 2020): panel de 233 áreas estadísticas básicas de Barcelona con efectos fijos, corroborado con variable instrumental: +1,9 % en alquileres en el área media y +7 % en el decil con más anuncios.","co":"Airbnb y FEVITUR lo consideran marginal (S082, S084). Referencia de otro país: en Santa Mónica se eliminó el 60 % de los anuncios sin efecto en los alquileres, porque las viviendas no volvieron al alquiler de larga duración."},{"id":"E090","de":"Q05","a":"B01","p":"+","m":"La rentabilidad turística se capitaliza en el precio de compra.","r":"1-3 años","P":"P3","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Garcia-López et al. (2020), versión publicada: +4,6 % en precios de transacción en el área media y +17 % en el decil con más anuncios.","co":""},{"id":"E091","de":"Q05","a":"A01","p":"-","m":"Cada vivienda turística es una vivienda menos para residentes.","r":"1-3 años","P":"P3","D":"D2","c":2,"h":0,"k":0,"q":1,"ev":"Garcia-López et al. (documento de trabajo de 2019, leído en la fuente): 100 anuncios más reducen un 2,8 % el número de hogares de un área, que los autores interpretan como menos oferta de alquiler de larga duración. Banco de España, DO 2432: las viviendas turísticas equivalen a cerca del 10 % del mercado de alquiler.","co":"Mide hogares, no viviendas en alquiler. Junts, Airbnb y Apartur niegan que al retirar licencias las viviendas vuelvan al alquiler habitual (S015, S082, S085). Madrid «recuperó» 323 viviendas en 2025 frente a unas 12.500 sin licencia."},{"id":"E092","de":"Q05","a":"O08","p":"+","m":"Los edificios se llenan de visitantes y los residentes se van.","r":"1-3 años","P":"P1","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Garcia-López et al. (documento de trabajo de 2019, tabla 5, leído en la fuente): 100 anuncios más reducen un 2,8 % el número de hogares del área, unos 80 hogares. Madrid (Chaves-Fonseca, SERIEs, 2026; 128 barrios, 2010-2018, variable instrumental): cada anuncio de vivienda entera supone 1,2 hogares menos, por menos llegadas de residentes y no por más salidas.","co":"Miden hogares totales, no inquilinos, y no dicen qué era antes la vivienda."},{"id":"E093","de":"Q05","a":"Q11","p":"-","m":"Con menos viviendas turísticas hay menos plazas y el alojamiento se encarece.","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Referencia de otro país: Nueva York, tras restringir el alquiler de corta estancia la tarifa hotelera media subió entre 14 y 19 dólares por noche (Anastasi et al., 2025, leído en la revisión de Fedea).","co":"En España el patrón por ciudades no es uniforme: en Palma y San Sebastián bajan las viviendas turísticas y sube la tarifa hotelera, pero en Barcelona bajan un 37 % y la tarifa apenas se mueve (Exceltur, parte interesada). Sin estimación española."},{"id":"E094","de":"L01","a":"Q06","p":"+","m":"Con el alquiler habitual topado, los contratos se desvían a temporada y habitaciones.","r":"meses","P":"P3","D":"D1","c":2,"h":0,"k":0,"q":0,"ev":"Observatori Metropolità de l’Habitatge (leído en la fuente): en Barcelona los contratos de temporada pasan del 12,9 % de los nuevos en el 1T 2024 al 26,3 % en el 4T 2024; en la oferta de portales, del 13,1 % en el 1T 2019 al 39,6 % en el 1T 2024.","co":"La cuota sube en parte porque el alquiler habitual rota menos. Sin estimación causal del trasvase."},{"id":"E095","de":"L01","a":"Q05","p":"+","m":"Con el alquiler habitual topado, parte de la oferta se desvía a uso turístico.","r":"1-3 años","P":"P1","D":"D0","c":0,"h":0,"k":0,"q":0,"ev":"","co":"Solo lo afirma un actor."},{"id":"E096","de":"Q06","a":"A01","p":"-","m":"Lo que se alquila por temporada o habitaciones sale del alquiler habitual.","r":"meses","P":"P2","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Banco de España, DO 2432 (leído en la fuente): a mediados de 2024 los anuncios de temporada crecían un 55 % interanual mientras los de alquiler residencial caían más de un 15 %.","co":"Mide anuncios, no viviendas. Atlas no encuentra una correlación estable con los precios."},{"id":"E097","de":"F06","a":"Q07","p":"+","m":"Los no residentes compran sobre todo segunda residencia.","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Banco de España (2020, leído en la fuente): los no residentes hicieron el 38 % de las compras de Alicante, el 28 % de Málaga y el 25 % de Santa Cruz de Tenerife.","co":""},{"id":"E098","de":"Q03","a":"A01","p":"-","m":"Una vivienda vacía donde hay demanda es oferta que no existe.","r":"inmediato","P":"P1","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"INE, Censo de 2021 (leído en la fuente): las ciudades de más de 250.000 habitantes tienen 403.073 viviendas vacías, el 7,5 % de su parque; son 3,6 por 100 habitantes, frente a 38,3 en los municipios de menos de 1.000.","co":"Euskadi 2023: solo el 2,4 % del parque es vivienda deshabitada «gestionable». El criterio del INE es consumo eléctrico, medido en el año de la pandemia."},{"id":"E099","de":"L08","a":"Q03","p":"-","m":"Tener la vivienda vacía sale más caro.","r":"1-3 años","P":"P0","D":"D1","c":0,"h":0,"k":0,"q":1,"ev":"Referencia de otro país: Segú (2020), Francia: el impuesto de 1999 redujo la tasa de vacancia un 13 %. Vancouver: −1,5 pp de vacancia, sin efecto en el alquiler medio.","co":"La única evaluación española contradice esas referencias: Ivàlua (2022), sobre el impuesto catalán a las viviendas vacías, concluye que su efecto sobre el número de viviendas vacías y sobre el alquiler no es estadísticamente significativo."},{"id":"E100","de":"L13","a":"Q03","p":"-","m":"Si la Administración garantiza la renta, el propietario de una vivienda vacía la cede.","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Observatorio Vasco de la Vivienda, evaluación de Bizigune (leída en la fuente): 6.224 viviendas captadas en 2020 y 7.375 a cierre de 2024, con requisito de llevar tres meses sin ocupar; coste de unos 4.850 € por vivienda y año.","co":"Evalúa el propio gestor, sin contrafactual. El programa que solo ofrece seguro de impago (ASAP) captó 278 viviendas, el 35 % de su objetivo. Referencia de otro país: en Francia el seguro voluntario no cumplió objetivos."},{"id":"E101","de":"L13","a":"G01","p":"+","m":"Las viviendas cedidas se alquilan a precio protegido y se suman al parque asequible.","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Bizigune: 7.375 viviendas a cierre de 2024 (Alokabide, memoria de 2024). Cataluña: 7.915 viviendas en la red de mediación. Navarra: 1.000 viviendas cedidas.","co":"Son cesiones temporales, no parque permanente."},{"id":"E102","de":"L13","a":"A09","p":"-","m":"Con el cobro garantizado, el arrendador acepta inquilinos que antes descartaba.","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Referencia de otro país: Cour des comptes (2025, leído en la fuente): la garantía pública francesa Visale cubrió 1,2 millones de contratos en 2016-2023; según una encuesta encargada por el gestor, el 79 % no se habría firmado sin ella.","co":"Parte de los arrendadores la rechaza porque la asocia a inquilinos frágiles. Sin evaluación en España: la línea estatal de 2025 aún no tiene resultados."},{"id":"E103","de":"L13","a":"A04","p":"-","m":"Si el cobro está garantizado, el propietario deja de temer el impago.","r":"meses","P":"P1","D":"D0","c":0,"h":0,"k":0,"q":0,"ev":"","co":"Solo lo afirma un actor."},{"id":"E104","de":"A03","a":"A02","p":"+","m":"Más hogares buscando, rentas más altas.","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Pinto (Fedea, 2026): 462 contactos por anuncio en Barcelona frente a 103 en Madrid.","co":"Dato compatible, no estimación."},{"id":"E105","de":"A01","a":"A02","p":"-","m":"Con menos oferta, los inquilinos compiten y la renta sube.","r":"meses","P":"P1","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Monràs y García-Montalvo (documento de trabajo de 2022, leído completo): elasticidad de los contratos nuevos respecto al precio en torno a 4.","co":""},{"id":"E106","de":"L01","a":"A02","p":"-","m":"El tope impide subir por encima del índice en los contratos regulados.","r":"meses","P":"P3","D":"D3","c":3,"h":0,"k":0,"q":0,"ev":"Cataluña 2020, dos estudios con identificación causal: Monràs y García-Montalvo (alrededor de −5 %) y Jofre-Monseny, Martínez-Mazza y Segú (entre −4 % y −6 %; estimación base −4,5 %). Barcelona 2024 (Observatori, leído en la fuente): precio de los contratos nuevos −6,4 % entre el 1T y el 4T. Referencia de otro país: París, alquileres un 5,2 % inferiores al contrafactual.","co":"Monràs y García-Montalvo atribuyen la mitad del efecto a un cambio de composición; Jofre-Monseny et al. no encuentran cambio en la calidad de lo alquilado. Para 2024 el efecto deja de ser significativo con métodos más exigentes (Pérez García, preprint de 2026)."},{"id":"E107","de":"L01","a":"A01","p":"-","m":"Con la renta topada, a algunos propietarios deja de compensarles alquilar como vivienda habitual.","r":"1-3 años","P":"P3","D":"D3","c":2,"h":0,"k":0,"q":1,"ev":"Monràs y García-Montalvo: los contratos nuevos caen entre un 10 % y un 14 %. Pérez García (preprint de 2026, leído completo): contratos −13 % en las zonas tensionadas de 2024, con la reserva del propio autor de que las tendencias previas divergían. Referencia de otro país: Berlín, fuerte reducción de los anuncios de alquiler.","co":"Jofre-Monseny et al. (2023), sobre el mismo episodio y con identificación causal, no detectan caída de contratos ni del parque activo. Kholodilin et al. (2022): las cantidades casi no reaccionan. Barcelona 2024 (Observatori): más altas que bajas de contratos, y el descenso de contratos nuevos había empezado en 2022. Llogateres: la caída es desvío a temporada (S036, S037). Datos de 2026 que no coinciden: según la Generalitat, con fianzas depositadas, los contratos vigentes aumentan en 20.994 desde la declaración de zonas tensionadas (S130); según portales inmobiliarios, los anuncios de alquiler en Barcelona caen un 22,2 % (Fedea, Apuntes 2026-15). Miden cosas distintas, contratos registrados y anuncios, y ninguna tiene contrafactual."},{"id":"E108","de":"L01","a":"A09","p":"+","m":"Con precio topado y muchos candidatos, el arrendador elige al más solvente.","r":"meses","P":"P2","D":"D0","c":1,"h":0,"k":0,"q":0,"ev":"","co":""},{"id":"E109","de":"L01","a":"F07","p":"-","m":"El tope reduce la rentabilidad esperada del inversor.","r":"1-3 años","P":"P1","D":"D0","c":0,"h":0,"k":0,"q":0,"ev":"","co":"Solo lo afirma un actor."},{"id":"E110","de":"L01","a":"P01","p":"-","m":"Con el alquiler topado se promueve menos vivienda.","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Kholodilin, López, Rey Blanco y González Arbués (2022, leído completo): viviendas iniciadas −6 % en Cataluña frente a +11,5 % en España tras la norma de 2020.","co":"Dato provincial que no separa los municipios regulados, como advierten los autores; coincide con la pandemia."},{"id":"E111","de":"A01","a":"A09","p":"-","m":"Con poca oferta, el arrendador puede exigir más.","r":"meses","P":"P2","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Pinto (Fedea, 2026): contactos por anuncio.","co":""},{"id":"E112","de":"A04","a":"A01","p":"-","m":"Si se teme no cobrar o no recuperar la vivienda, no se alquila.","r":"1-3 años","P":"P3","D":"D1","c":2,"h":0,"k":0,"q":0,"ev":"OCU (2025): entre quienes tienen una segunda vivienda y no la ofrecen, al 26 % alquilarla «no le parece seguro». OCU y Ministerio de Consumo (2023, leído en la fuente; 437 arrendadores): al 76,4 % le preocupa no cobrar y al 44,2 % no poder recuperar la vivienda a tiempo.","co":"En la misma encuesta, el 76 % de los arrendadores no ha tenido ningún problema con su inquilino en cinco años, y el primer obstáculo que citan es el precio."},{"id":"E113","de":"A04","a":"Q03","p":"+","m":"La vivienda que no se alquila por miedo se queda vacía.","r":"1-3 años","P":"P3","D":"D1","c":2,"h":0,"k":0,"q":0,"ev":"OCU (2025): el 26 % de quienes no ofrecen su segunda vivienda dice que alquilarla no le parece seguro; el 55 % la usa de recreo.","co":"El miedo no es el primer motivo."},{"id":"E114","de":"A04","a":"A09","p":"+","m":"Quien teme no cobrar pide más garantías o descarta perfiles.","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"OCU y Ministerio de Consumo (2023, leído en la fuente): entre los propietarios con vivienda disponible, el 79 % no alquilaría a inmigrantes en situación irregular, el 70 % a personas sin empleo estable y el 48 % a inquilinos con ingresos justos.","co":"Dato compatible, no estimación."},{"id":"E115","de":"A05","a":"A01","p":"-","m":"Cuanto más tarda el juzgado en devolver la vivienda, menos se alquila.","r":"1-3 años","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Mora-Sanguinetti (SERIEs, 2012, leído completo): panel de 50 provincias, 2001-2007; un punto más de congestión judicial en la fase de ejecución eleva la cuota de propiedad entre 0,14 y 0,16 pp.","co":"El autor califica el efecto de «menor»; no lo hay en la fase declarativa. Mide congestión, no duración, y cuota de propiedad, no oferta de alquiler."},{"id":"E116","de":"A05","a":"A04","p":"+","m":"Cuanto más tarda el juzgado, más riesgo percibe el propietario.","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"OCU y Ministerio de Consumo (2023): al 44,2 % de los arrendadores le preocupa poder recuperar la vivienda en un tiempo prudencial.","co":"Dato compatible, no estimación."},{"id":"E117","de":"A06","a":"A01","p":"-","m":"Si el impago se tolera, los propietarios dejan de alquilar.","r":"1-3 años","P":"P1","D":"D0","c":0,"h":0,"k":0,"q":0,"ev":"","co":"Solo lo afirma un actor. OCU (2025): el 4 % de los arrendadores ha sufrido impagos reincidentes."},{"id":"E118","de":"A07","a":"A04","p":"+","m":"La ocupación, aunque sea infrecuente, pesa mucho en la percepción.","r":"meses","P":"P1","D":"D0","c":0,"h":0,"k":0,"q":1,"ev":"","co":"Iglesias y Jacinto: es un miedo infundado o inducido (S008, S080). Ministerio del Interior: 14.875 hechos conocidos por allanamiento o usurpación en 2025."},{"id":"E119","de":"L02","a":"A01","p":"-","m":"Si la protección del inquilino recae sobre el propietario, este se retrae.","r":"1-3 años","P":"P3","D":"D1","c":2,"h":0,"k":0,"q":0,"ev":"Referencia de otro país: Casas-Arce y Saiz (2010), comparación entre países citada por el Banco de España (DO 2002): relación negativa entre la falta de seguridad jurídica del propietario y el desarrollo del mercado de alquiler.","co":"El Banco de España lo formula en condicional. Sin estimación española."},{"id":"E120","de":"L02","a":"A04","p":"+","m":"Más protección al inquilino vulnerable eleva el riesgo de impago que asume el propietario.","r":"meses","P":"P3","D":"D0","c":1,"h":0,"k":0,"q":0,"ev":"","co":""},{"id":"E121","de":"L02","a":"A05","p":"+","m":"Las moratorias y garantías alargan el procedimiento.","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"CGPJ: la duración media estimada de los juicios verbales arrendaticios pasa de 4,5 meses en 2014 a 8,5 en 2023.","co":"No separa el efecto de la norma del de la congestión judicial; mide hasta la resolución, no hasta el lanzamiento."},{"id":"E122","de":"L02","a":"O04","p":"-","m":"La moratoria y los límites al desahucio evitan lanzamientos.","r":"meses","P":"P1","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"CGPJ (leído en la fuente): los lanzamientos derivados de la ley de arrendamientos bajan de 36.468 en 2019 a 18.317 en 2025. El Banco de España atribuye parte de la caída a esas limitaciones (Informe Anual 2023, p. 277).","co":"La PAH estima 34.780 lanzamientos suspendidos en 2021-2023 (fuente de parte). Mide suspensiones, no hogares que conservan la vivienda."},{"id":"E123","de":"L02","a":"A11","p":"+","m":"Si desahuciar es más difícil, el arrendador selecciona más y discrimina más.","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Referencia de otro país: Arefeva, Hu y Timmins (NBER, 2024; solo leído el resumen): con el desahucio suspendido, los gestores respondieron menos a solicitantes afroamericanos, en un experimento de más de 25.000 consultas.","co":"Mercado y moratoria distintos. Sin estudio español."},{"id":"E124","de":"L10","a":"A01","p":"-","m":"Si las reglas cambian a menudo, se ofrece menos vivienda en alquiler.","r":"1-3 años","P":"P3","D":"D0","c":1,"h":0,"k":0,"q":0,"ev":"","co":"No existe ninguna estimación española."},{"id":"E125","de":"L10","a":"A04","p":"+","m":"Si la norma cambia a menudo, el propietario no sabe a qué atenerse.","r":"1-3 años","P":"P1","D":"D0","c":0,"h":0,"k":0,"q":0,"ev":"","co":"Solo lo afirma un actor."},{"id":"E126","de":"L04","a":"A01","p":"+","m":"La rebaja fiscal hace más rentable alquilar como vivienda habitual.","r":"1-3 años","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"AIReF (2020, leído completo): la reducción del 60 % «sí consigue su objetivo de fomentar la oferta», sin poder distinguir oferta nueva de alquiler que aflora. Al suprimirse en 2015 la reducción del 100 % por alquilar a jóvenes, el 12 % de esos inmuebles salió del alquiler en tres años, frente al 9 % del resto.","co":"AIReF la califica de regresiva y propone reformularla. García Montalvo: con riesgo percibido alto, los incentivos no bastan (S073)."},{"id":"E127","de":"L05","a":"A02","p":"+","m":"Con oferta rígida, la ayuda al inquilino acaba en parte en la renta.","r":"1-3 años","P":"P1","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Referencia de otro país: Fack (2006), Francia: cada euro de ayuda eleva la renta 78 céntimos.","co":"Sin evaluación del bono joven en España."},{"id":"E128","de":"L05","a":"O01","p":"-","m":"La ayuda reduce lo que el hogar beneficiario paga de su bolsillo.","r":"meses","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable, solo para los hogares que reciben la ayuda.","co":""},{"id":"E129","de":"L05","a":"B03","p":"+","m":"El aval público permite comprar sin tener la entrada.","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Avales ICO (visto en prensa): 10.453 operaciones a cierre de 2025, cerca del 10 % de la dotación.","co":"Referencia de otro país: Carozzi, Hilber y Yu (2024), Reino Unido: con oferta rígida, sube precios sin más construcción."},{"id":"E130","de":"A11","a":"O04","p":"+","m":"Quien es rechazado acaba en vivienda peor o más cara.","r":"meses","P":"P1","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Provivienda (2025): en pruebas con 100 agencias de Madrid y Barcelona, el 99 % aceptó prácticas discriminatorias hacia personas extranjeras.","co":"Mide la discriminación, no su efecto sobre la exclusión."},{"id":"E131","de":"A09","a":"O04","p":"+","m":"Quien no cumple los requisitos se queda fuera del mercado formal.","r":"meses","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E132","de":"A09","a":"A11","p":"+","m":"Cuando el arrendador puede elegir, los perfiles discriminados son los primeros descartados.","r":"meses","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E133","de":"A02","a":"O08","p":"+","m":"Cuando la renta sube en la renovación, el hogar se va del barrio.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E134","de":"G04","a":"G02","p":"+","m":"Con más presupuesto se promueve más vivienda protegida.","r":"1-3 años","P":"P1","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Ministerio de Vivienda (leído en la fuente): 85.028 calificaciones definitivas en 1997 y 12.858 en 2025. Eurostat: el gasto público en promoción de vivienda fue del 0,4 % del PIB en 2000 y del 0,2 % en 2024.","co":"Dato compatible, no estimación."},{"id":"E135","de":"G04","a":"G01","p":"+","m":"La inversión pública financia vivienda de alquiler social.","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Plan de Recuperación (nota oficial): 24.964 viviendas de alquiler social financiadas, con 994,6 millones de euros.","co":"Son viviendas financiadas, no terminadas."},{"id":"E136","de":"G05","a":"G02","p":"+","m":"Si el módulo cubre el coste, promotores y cooperativas hacen protegida.","r":"1-3 años","P":"P3","D":"D0","c":1,"h":0,"k":0,"q":0,"ev":"","co":"Lo afirman el sector y el Banco de España; no se ha localizado ningún estudio que compare módulos y costes."},{"id":"E137","de":"P03","a":"G05","p":"-","m":"Con el precio máximo fijo, cada subida de costes se come el margen.","r":"meses","P":"P3","D":"D0","c":1,"h":0,"k":0,"q":0,"ev":"","co":"Lo afirman el sector y el Banco de España, sin estudio cuantitativo."},{"id":"E138","de":"G06","a":"G02","p":"+","m":"Lo presupuestado solo se convierte en vivienda si se licita y se ejecuta.","r":"1-3 años","P":"P3","D":"D1","c":2,"h":0,"k":0,"q":0,"ev":"Banco de España, Informe Anual 2025, con datos de la AIReF (leído en la fuente): a finales de 2025 se había formalizado el 54 % de los fondos europeos de rehabilitación disponibles.","co":"Dato compatible; se refiere a rehabilitación, no a vivienda protegida."},{"id":"E139","de":"G02","a":"G01","p":"+","m":"La vivienda protegida destinada a alquiler y con protección permanente entra en el parque social.","r":"1-3 años","P":"P2","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad de stock y flujo. Históricamente la mayor parte fue vivienda en venta, que no entra.","co":""},{"id":"E140","de":"G03","a":"G01","p":"-","m":"Cada vivienda descalificada sale del parque asequible.","r":"inmediato","P":"P3","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad de stock y flujo. No hay estadística oficial de descalificaciones; Civio (2026, visto en resumen) estima que más de 340.000 viviendas protegidas cumplirán su plazo entre 2026 y 2030.","co":""},{"id":"E141","de":"G01","a":"O01","p":"-","m":"Quien accede a alquiler social paga menos.","r":"inmediato","P":"P3","D":"D1","c":2,"h":0,"k":0,"q":0,"ev":"Eurostat (2025): la sobrecarga por coste de vivienda es del 8,4 % entre los inquilinos a precio reducido y del 26,8 % entre los de mercado. Banco de España (leído en la fuente): unas 290.000 viviendas públicas de alquiler, donde reside el 1,6 % de los hogares.","co":"Sin evaluación española del efecto del parque social. La categoría de Eurostat mezcla alquiler social, renta antigua y cesión."},{"id":"E142","de":"G01","a":"A03","p":"-","m":"Cada hogar alojado en vivienda social deja de competir en el mercado.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E143","de":"O01","a":"M01","p":"+","m":"Cuando el alquiler ahoga a muchos hogares, la vivienda sube entre las preocupaciones.","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"CIS, barómetro de enero de 2026 (leído en la fuente): el 42,6 % cita la vivienda entre los principales problemas de España, máximo de la serie. Manifestaciones de 2024-2026 (vistas en prensa).","co":"Dato compatible, no estimación."},{"id":"E144","de":"O03","a":"M01","p":"+","m":"Una generación que no puede emanciparse se moviliza.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E145","de":"O04","a":"M01","p":"+","m":"Los desahucios visibles movilizan.","r":"meses","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E146","de":"O08","a":"M01","p":"+","m":"La expulsión de residentes genera protesta vecinal.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E147","de":"M01","a":"L01","p":"+","m":"La presión social empuja a regular precios.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":"No hay ninguna estimación en España. Chaqués-Bonafont, Palau y Baumgartner: la distancia entre lo que preocupa a los ciudadanos y lo que ocupa a los legisladores ha aumentado."},{"id":"E148","de":"M01","a":"L02","p":"+","m":"La presión social empuja a proteger frente al desahucio.","r":"meses","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E149","de":"M01","a":"L03","p":"+","m":"La presión vecinal empuja a restringir el alquiler turístico.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E150","de":"M01","a":"L05","p":"+","m":"La ayuda directa es la respuesta más rápida y visible.","r":"meses","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E151","de":"M01","a":"G04","p":"+","m":"La presión social empuja a anunciar inversión en vivienda pública.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":"El salto presupuestario de 2021-2023 coincide con los fondos europeos, no con la preocupación ciudadana, entonces baja."},{"id":"E152","de":"M01","a":"L09","p":"+","m":"La presión empuja a cerrar las vías de escape de la regulación.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E153","de":"M01","a":"M02","p":"+","m":"Cuanto más pesa el problema, más rentable es políticamente diferenciarse en el diagnóstico.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E154","de":"M01","a":"L10","p":"+","m":"Cada pico de presión produce un nuevo decreto.","r":"meses","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":"Solo hay coincidencias temporales, como la de octubre de 2026."},{"id":"E155","de":"M02","a":"L10","p":"+","m":"Cada cambio de mayoría revierte o modifica las reglas del anterior.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E156","de":"M02","a":"S06","p":"-","m":"Sin acuerdo entre bloques, las reformas de fondo no salen.","r":">3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":""},{"id":"E157","de":"M03","a":"M01","p":"-","m":"Mientras la mayoría es propietaria, la subida de precios beneficia a más votantes de los que perjudica.","r":">3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":"Un estudio sobre Madrid (Electoral Studies, 2026, visto en prensa) asocia la subida del alquiler con más voto a la derecha donde hay muchos propietarios; es correlacional y no mide presión social."},{"id":"E158","de":"T01","a":"Q12","p":"+","m":"Más visitantes para un número parecido de viviendas: cada vivienda turística se ocupa más noches.","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"INE (ficheros leídos): los turistas internacionales pasan de 83,5 millones en 2019 a 96,8 en 2025 (+15,9 %) y las noches en alojamientos de plataformas de 105,6 a 189,5 millones (+79 %), con un número de viviendas turísticas parecido (321.496 en agosto de 2020; 341.001 en mayo de 2026).","co":"Dato compatible, no estimación. Las cifras de plataformas de 2024-2025 parecen calculadas con otro método que las anteriores. No existe ningún estudio español que estime el efecto de las llegadas sobre el número de viviendas turísticas."},{"id":"E159","de":"Q12","a":"Q05","p":"+","m":"Si el uso turístico rinde más que el alquiler habitual, más viviendas pasan a él.","r":"1-3 años","P":"P3","D":"D1","c":2,"h":0,"k":0,"q":0,"ev":"Exceltur, ReviTUR (2022, leído en la fuente; patronal turística, parte interesada): una vivienda tipo ingresa 2.674 €/mes en turístico frente a 1.056 €/mes en larga estancia, media de 20 ciudades en junio. Garcia-López et al. (documento de trabajo de 2019): en Barcelona en 2015, diez noches al mes igualaban el alquiler mensual. Con la pandemia las plazas cayeron un 31,4 % entre 2019 y 2021 y volvieron en 2022 (ReviTUR). Referencia de otro país: Sídney, la prima del alquiler de corta estancia baja del 106 % al 78 % a medida que los caseros se pasan a él (Hill et al., 2023, vía Fedea).","co":"Ningún estudio español estima cuánto responde la conversión a la diferencia de ingresos. La cifra de Exceltur es de ingresos brutos y de temporada alta."},{"id":"E160","de":"Q13","a":"Q05","p":"+","m":"Cada vivienda vacía o heredada que se anuncia como turística se suma al parque turístico.","r":"inmediato","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable.","co":""},{"id":"E161","de":"Q14","a":"Q05","p":"+","m":"Cada alquiler habitual que pasa a turístico se suma al parque turístico.","r":"inmediato","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable.","co":""},{"id":"E162","de":"Q14","a":"A01","p":"-","m":"Cada alquiler habitual que pasa a turístico sale de la oferta para residentes.","r":"inmediato","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable.","co":""},{"id":"E163","de":"Q14","a":"O09","p":"+","m":"El inquilino al que no se renueva para cambiar el uso tiene que irse.","r":"inmediato","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable.","co":""},{"id":"E164","de":"Q12","a":"Q13","p":"+","m":"Quien hereda o tiene una vivienda vacía la anuncia como turística si rinde más que venderla o alquilarla.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":"No existe ninguna medición del uso que se da a la vivienda heredada: se inscriben unas 208.000 herencias de vivienda al año (INE, 2025) y Fotocasa solo distingue venta de alquiler. Una encuesta de PwC para Airbnb (550 anfitriones, fuente de parte) clasifica el 52 % de los alojamientos como segunda residencia de uso ocasional, sin preguntar qué eran antes."},{"id":"E165","de":"Q12","a":"Q14","p":"+","m":"El propietario no renueva al inquilino para pasar la vivienda a uso turístico.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":"Nadie ha contado los contratos no renovados por este motivo. Indicio indirecto: en Barcelona, 100 anuncios más reducen en 80 los hogares del área (Garcia-López et al.), sin distinguir inquilinos de propietarios."},{"id":"E166","de":"Q12","a":"Q15","p":"+","m":"Los inversores compran edificios enteros donde el cambio de uso rinde más.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":"Sin dato del uso al que pasan los edificios comprados."},{"id":"E167","de":"Q15","a":"O09","p":"+","m":"Quien compra el edificio entero no renueva los contratos para vaciarlo.","r":"1-3 años","P":"P3","D":"D1","c":2,"h":0,"k":0,"q":0,"ev":"Bonshoms (tesis doctoral, Universidad de Leeds, 2023; leídos el resumen y un capítulo): inversores locales medianos compran edificios en zona céntrica, desplazan a los inquilinos y reforman para vender o alquilar por días. Casos documentados en prensa: Tribulete 7 (Madrid), comprado en bloque en 2024, donde de 52 familias quedan 15 (El Salto, octubre de 2026, medio afín al movimiento); Casa Orsola (Barcelona), con desahucios señalados para 2025 y paralizados al comprar el edificio el Ayuntamiento y una fundación por 9,2 M€ (eldiario.es).","co":"Son casos, no una medición: nadie ha contado cuántos inquilinos salen tras estas ventas. La cifra de Madrid es una estimación de riesgo del Sindicato de Inquilinas, sin método publicado. No se ha leído la versión de los compradores."},{"id":"E168","de":"L01","a":"Q15","p":"-","m":"Con la renta topada, comprar un edificio para subir los alquileres rinde menos.","r":"1-3 años","P":"P1","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Observatori Metropolità de l’Habitatge (visto en prensa): las compraventas de edificios notificadas al Ayuntamiento de Barcelona pasan de 217 en 2024 a 149 en 2025 (−31 %); fueron 202, 167 y 212 en 2021-2023.","co":"Sin contrafactual: atribuir la caída a la regulación es interpretación del Observatori. Solo Barcelona."},{"id":"E169","de":"A02","a":"O09","p":"+","m":"Cuando la renta sube más de lo que el hogar puede pagar, se va sin que haya juicio.","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"IDRA (2024, leído en la fuente; instituto próximo al movimiento inquilino): el 30,8 % de las últimas mudanzas de inquilinos en Madrid y el 31,6 % en Barcelona fueron forzosas, y solo el 1,5 % por orden judicial. Área metropolitana de Barcelona (encuesta de cohesión urbana de 2025, vista en prensa): los cambios de vivienda por motivos económicos o forzados pasan del 5,7 % en 1995 al 23,9 % en 2025.","co":"La encuesta de IDRA no es probabilística y no separa la subida de renta de la no renovación ni de las presiones. El INE pregunta por el fin de contrato como motivo de mudanza, pero no se ha localizado la tabla."},{"id":"E170","de":"L02","a":"O09","p":"-","m":"Contratos más largos y prórrogas obligatorias dejan menos ocasiones de no renovar.","r":"1-3 años","P":"P1","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Referencia de otro país: San Francisco (Diamond, McQuade y Qian, 2019; solo leído el resumen): el control de rentas con protección frente al desalojo reduce un 20 % la movilidad de los inquilinos y su salida de la ciudad. Escocia: tras eliminar en 2017 el desahucio sin causa, el 80 % de los inquilinos encuestados confía en poder quedarse (estudio RentBetter, visto en la nota de su financiador).","co":"No existe evaluación de la reforma española de 2019, que alargó los contratos de 3 a 5 o 7 años. El mismo estudio de San Francisco halla que los caseros reducen la oferta de alquiler un 15 %."},{"id":"E171","de":"O09","a":"O04","p":"+","m":"Quien es expulsado sin alternativa acaba en vivienda peor, hacinado o sin hogar.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":"IDRA: solo entre el 25 % y el 28 % de quienes se mudan van a un barrio de renta menor."},{"id":"E172","de":"L15","a":"G01","p":"+","m":"Cada vivienda adquirida por tanteo y retracto pasa al parque público.","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Generalitat de Catalunya, informe del sector de la vivienda de 2024 (leído en la fuente): 662 viviendas adquiridas en 2024 y 544 en 2023, con un gasto de 49,9 y 43,8 millones de euros; 4.746 viviendas administradas procedentes de tanteo y retracto. Ayuntamiento de Barcelona: 21 fincas con 291 viviendas.","co":"Se ejerce en torno al 2 % de los expedientes abiertos. En Cataluña recae sobre viviendas procedentes de ejecuciones hipotecarias, no sobre edificios con inquilinos. En la Comunitat Valenciana no se adquirió ninguna en 2024, por falta de presupuesto y de medios."},{"id":"E173","de":"L15","a":"O09","p":"-","m":"Si la Administración compra el edificio, los inquilinos se quedan.","r":"inmediato","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":"Un solo caso documentado (Casa Orsola), y fue una compra negociada, no un tanteo."},{"id":"E174","de":"L16","a":"F10","p":"-","m":"Si se limita comprar vivienda existente como inversión, los inversores compran menos.","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Referencia de otro país: Países Bajos (Francke, Hans, Korevaar y van Bekkum, 2023; leídos resumen e introducción): la prohibición de comprar para alquilar redujo en torno a un 75 % las compras de inversores en las viviendas afectadas y elevó unos 14 puntos la cuota de primeros compradores.","co":"El mismo estudio: los precios de venta no variaron y los alquileres subieron un 4 % en Róterdam (S129). Un año de datos y otro país. En España no ha llegado a aplicarse ninguna medida de este tipo."},{"id":"E175","de":"F10","a":"B01","p":"+","m":"La demanda de los inversores institucionales se suma a la de los hogares.","r":"1-3 años","P":"P0","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Bandoni et al., Banco Central Europeo, documento de trabajo 3026 (leído el resumen): un aumento de la demanda de inversores institucionales tiene un efecto «positive and persistent» sobre el crecimiento del precio de la vivienda; modelo vectorial y panel regional de ocho países de la zona euro, España incluida.","co":"Mide precios de compra, no alquileres ni desahucios. Sin estimación separada para España."},{"id":"E176","de":"F10","a":"A02","p":"+","m":"Los propietarios institucionales suben la renta de las viviendas que compran más que otros caseros.","r":"1-3 años","P":"P3","D":"D1","c":2,"h":0,"k":0,"q":0,"ev":"Tres estudios de caso españoles revisados por pares. Janoschka et al. (2020): en los bloques de Carabanchel comprados por Blackstone, los ingresos por alquiler suben un 38 % entre 2014 y 2017. Yrigoy (2021): en Tres Cantos, la renta media pasa de 560 a 800 €/mes al acabar la protección. Martínez y Gil (2022): subidas «around 100%» al vencer los contratos. Referencia de otro país: Irlanda (McCarthy, Banco Central de Irlanda, 2024; estimación causal): suben el alquiler 4,1 puntos más que otros caseros en viviendas comparables tras la compra.","co":"Son casos, sin estimación para el conjunto de España. No contradice que los institucionales añadan oferta, que es otra relación del mapa: para Estados Unidos, Coven (2025) estima que amplían la oferta de alquiler y bajan su precio. El peso de las sociedades es del 8,1 % del alquiler habitual (Banco de España, 2021)."},{"id":"E177","de":"L03","a":"Q06","p":"+","m":"Las viviendas que dejan el uso turístico se desvían al alquiler de temporada.","r":"1-3 años","P":"P1","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Ministerio de Vivienda (nota del 2 de febrero de 2026, leída): de 412.253 solicitudes de registro de alquiler de corta duración, el 22 % son de temporada; en la Comunidad de Madrid, 21.978 de 26.355 (83 %). Fedea, DT 2026-02: los operadores profesionales arbitran entre la corta y la media estancia.","co":"El Banco de España lo plantea como posibilidad, sin cifra. Nadie ha medido en España a qué uso pasan las viviendas que dejan de ser turísticas. Referencia de otro país: la evidencia está dividida: los alquileres bajan un 2-3 % en Irvine, Los Ángeles y Berlín (2016), no cambian en Santa Mónica ni en Nueva York el primer año, y suben en Sídney."},{"id":"E178","de":"L09","a":"Q06","p":"-","m":"Si la temporada también se regula, deja de ser una vía de escape.","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Observatori Metropolità de l’Habitatge, informe semestral n.º 4 (abril de 2026, leído completo): en Barcelona, 1.282 contratos de temporada nuevos en el cuarto trimestre de 2025, un 53 % menos que un año antes, coincidiendo, según el informe, con la ley catalana 11/2025, de 29 de diciembre.","co":"El propio Observatori advierte de que no se puede establecer una relación directa entre ese descenso y el aumento de contratos permanentes. Junyent: al regularla, los pisos se vendieron o quedaron vacíos (S055)."},{"id":"E179","de":"Q15","a":"O04","p":"+","m":"Los inquilinos de un edificio comprado por un inversor acaban desahuciados por vía judicial.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":"Premisa de JC. Lo localizado apunta en otro sentido: en la encuesta de IDRA solo el 1,5 % de las mudanzas forzosas fue por orden judicial, y en Tribulete 7 se habían ido 37 de 52 familias cuando empezaban a llegar las demandas de desahucio."},{"id":"E180","de":"F10","a":"Q05","p":"+","m":"Fondos y socimis destinan las viviendas que compran a alojamiento turístico.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":"Premisa de JC. No existe ningún dato de viviendas turísticas propiedad de fondos o socimis. En Canarias, el 28 % de las viviendas vacacionales es de empresas (informe autonómico visto en prensa)."},{"id":"E181","de":"Q15","a":"Q05","p":"+","m":"Parte de los edificios comprados en bloque se destina a alojamiento turístico.","r":"1-3 años","P":"P3","D":"D1","c":2,"h":0,"k":0,"q":0,"ev":"Cocola-Gant, Hodkinson y Janoschka (2025, leído en acceso abierto): en Barcelona, el 56 % de las 10.058 viviendas con licencia turística es de personas jurídicas; 382 titulares (8,8 %) reúnen 5.195 licencias (51 %), y más de un tercio de las licencias está en 216 edificios con diez o más. Hubo 3.501 compraventas de viviendas con licencia entre 2016 y 2024.","co":"Con las licencias congeladas desde 2014, lo medido es concentración de viviendas que ya eran turísticas, no conversión de alquiler habitual: nadie cuantifica cuántos edificios comprados cambian de uso. Según esta literatura lo hacen inversores locales medianos y socimis pequeñas; ningún propietario supera los 200 apartamentos turísticos en Barcelona."},{"id":"E182","de":"Q15","a":"Q06","p":"+","m":"Parte de los edificios comprados pasa a alquiler de temporada, por habitaciones o a residencias compartidas.","r":"1-3 años","P":"P2","D":"D0","c":1,"h":0,"k":0,"q":0,"ev":"","co":"Lo afirman entidades vecinales y sociales, sin recuento. En la Esquerra de l’Eixample, 68 bloques en manos de fondos según la asociación de vecinos (visto en prensa)."},{"id":"E183","de":"F10","a":"O09","p":"+","m":"Tras la compra: contratos cortos, no renovación y sustitución de inquilinos.","r":"1-3 años","P":"P1","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Janoschka et al. (European Urban and Regional Studies, 2020): en los bloques de vivienda pública de Carabanchel comprados por Blackstone, más del 40 % de los inquilinos tenía contratos de menos de un año; describe abandono del mantenimiento, desahucios selectivos y sustitución de inquilinos. Martínez y Gil (Housing Studies, 2022): al vencer los contratos se pedían subidas «around 100%».","co":"Estudios de caso de un barrio y de un fondo, sin grupo de comparación. En el registro de la PAH de Barcelona (no representativo), los fondos promueven el 10,7 % de 289 desahucios de 2018-2019 y los particulares el 38,4 %."},{"id":"E184","de":"A02","a":"A12","p":"+","m":"Cuando alquilar un piso entero es inasequible, se alquila una habitación.","r":"1-3 años","P":"P1","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Consejo de la Juventud (Observatorio de Emancipación 2025, con precios de anuncio): alquilar una vivienda en solitario cuesta el 98,7 % del salario de una persona joven y una habitación el 33,6 %; las habitaciones anunciadas aumentan un 85,4 % desde 2022; comparte vivienda el 33,6 % de los jóvenes emancipados en alquiler.","co":"Los datos de volumen proceden de un portal inmobiliario. No hay cifra oficial del alquiler por habitaciones."},{"id":"E185","de":"A12","a":"O10","p":"+","m":"Más personas adultas sin parentesco en la misma vivienda.","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Eurostat (ficheros leídos): los inquilinos de mercado en vivienda sobreocupada pasan del 15,4 % en 2021 al 20,5 % en 2025, y los que viven en hogares de tres adultos o más, del 24,2 % al 31,0 %.","co":"Evolución simultánea, no estimación: la sobreocupación sube también en las demás formas de tenencia."},{"id":"E186","de":"A12","a":"O01","p":"-","m":"Quien comparte paga solo su habitación, y su esfuerzo medido baja.","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Eurostat: entre 2021 y 2025 la sobrecarga de gasto en vivienda baja en los hogares de varios adultos y apenas entre quienes viven solos (del 20,1 % al 18,7 %). INE, metodología de la Encuesta de Condiciones de Vida: quien alquila una habitación cuenta como hogar inquilino, con el coste de la habitación.","co":"Es una mejora del indicador a cambio de espacio. Sin los microdatos no se puede separar de la subida de las rentas bajas: el salario de la décima parte que menos gana sube un 48 % entre 2018 y 2024 (INE)."},{"id":"E187","de":"L09","a":"A12","p":"-","m":"Limitar la suma de las rentas de las habitaciones a la del piso entero quita el incentivo a trocear la vivienda.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":"El Real Decreto-ley 29/2026 lo establece desde el 8 de octubre de 2026; pendiente de convalidación y sin efecto medible todavía."},{"id":"E188","de":"A01","a":"A13","p":"-","m":"Cuanta menos oferta, más se paga por lo que sale al mercado.","r":"1-3 años","P":"P0","D":"D0","c":0,"h":1,"k":0,"q":0,"ev":"","co":"El Banco de España mide el sobreprecio, pero no lo relaciona con la oferta."},{"id":"E189","de":"A13","a":"D07","p":"+","m":"Si entrar cuesta mucho más que quedarse, quien no tiene contrato no llega a formar hogar.","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Banco de España, Informe Anual 2025 (leído): los nuevos entrantes «se enfrentan a esfuerzos más elevados en el momento de la firma del contrato». El sobreprecio de entrada sube del 6,2 % en 2020 al 16,5 % en 2024, y los jóvenes de 25 a 34 años que viven con sus padres, del 46,0 % en 2021 al 50,2 % en 2025 (Eurostat).","co":"Evolución simultánea, no estimación."},{"id":"E190","de":"R03","a":"D02","p":"+","m":"Donde se crea empleo, llega población de fuera.","r":"1-3 años","P":"P1","D":"D2","c":2,"h":0,"k":0,"q":0,"ev":"Banco de España, Informe Anual 2025 (leído): los factores de atracción explican el 57 % del cambio en los flujos migratorios (cita a Fernández-Huertas, 2025). Entre finales de 2019 y de 2024, en torno al 76 % de los puestos de trabajo creados los ocuparon personas nacidas fuera (Informe Anual 2024).","co":"Solo el 18,1 % de los primeros permisos de residencia de 2025 fue por empleo; el 43,4 % fue por reagrupación familiar (Eurostat). La tasa de paro de los extranjeros es del 14,3 %, frente al 9,0 % de los españoles (EPA, 2.º trimestre de 2026)."},{"id":"E191","de":"D02","a":"D03","p":"+","m":"Quienes llegan forman hogares nuevos.","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"INE, Estadística Continua de Población (ficheros leídos): entre el 1 de enero de 2021 y el de 2025 la población aumenta en 1.727.499 personas; los nacidos en el extranjero aumentan en 2.209.413 y los nacidos en España disminuyen en 481.914.","co":"Es población, no hogares: ni el INE ni el Banco de España publican qué parte de los hogares nuevos es de personas nacidas fuera."},{"id":"E192","de":"D02","a":"A03","p":"+","m":"Quien llega vive sobre todo de alquiler.","r":"meses","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"INE, Encuesta de Condiciones de Vida 2025: vive en alquiler a precio de mercado el 63,4 % de los hogares de nacionalidad extracomunitaria y el 47,4 % de los de la UE, frente al 11,3 % de los españoles. Banco de España, Informe Anual 2025: entre los inquilinos recientes, los inmigrantes pasan del 42,5 % al 53,5 % entre 2002-2008 y 2022-2024.","co":"No hay estimación reciente del efecto sobre el precio: los estudios causales llegan a 2012 o a 2019. Los extranjeros residentes hacen además el 10,1 % de las compras de vivienda."},{"id":"E193","de":"D02","a":"O10","p":"+","m":"Quien llega con ingresos bajos absorbe el coste del alquiler compartiendo vivienda.","r":"1-3 años","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Eurostat (ficheros leídos): entre las personas de nacionalidad extranjera, la sobreocupación pasa del 9,6 % en 2015 al 19,3 % en 2025, mientras su sobrecarga de gasto en vivienda baja del 37,6 % al 22,4 %; entre los españoles, la sobreocupación pasa del 4,3 % al 6,7 %. Su salario medio es el 77,7 % del de los españoles (INE, 2024) y el riesgo de pobreza de los extracomunitarios, del 44,5 %.","co":"Evolución simultánea, no estimación. El grupo es heterogéneo: el 19,6 % de los ocupados extranjeros es directivo, técnico o profesional, y el 29,5 % entre los de la UE."},{"id":"E194","de":"D03","a":"D07","p":"-","m":"Cada hogar que se forma es un hogar menos que se queda sin formar.","r":"inmediato","P":"P0","D":"D3","c":3,"h":0,"k":1,"q":0,"ev":"Identidad contable.","co":""},{"id":"E195","de":"G01","a":"O04","p":"-","m":"Un hogar en exclusión que accede a una vivienda social estable deja de estarlo.","r":"inmediato","P":"P0","D":"D1","c":1,"h":0,"k":0,"q":0,"ev":"Evaluación del programa Hábitat (España, 2021; asignación aleatoria, 18 meses; promovida por las entidades que lo gestionan): el 96 % de los participantes conserva la vivienda; en el grupo de comparación, el 27 % sigue en la calle y menos del 10 % ha accedido a un alojamiento independiente. Eurostat, España 2024: sobrecarga de gasto en vivienda del 28,1 % en alquiler de mercado y del 8,2 % en alquiler reduci
