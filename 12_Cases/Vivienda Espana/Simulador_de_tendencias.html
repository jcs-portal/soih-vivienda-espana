que el promotor no puede pagar solo."},{"id":"E056","de":"F01","a":"F05","p":"-","c":0,"h":1,"q":0,"r":0.5,"m":"Con tipos bajos, la vivienda rinde más que los depósitos y la deuda."},{"id":"E057","de":"F09","a":"F07","p":"+","c":0,"h":1,"q":0,"r":2,"m":"El capital internacional entra a través de fondos y socimis."},{"id":"E058","de":"F08","a":"F05","p":"+","c":0,"h":1,"q":0,"r":2,"m":"Cuanto más rinde alquilar, más compensa comprar para alquilar."},{"id":"E059","de":"F08","a":"F07","p":"+","c":0,"h":1,"q":0,"r":2,"m":"La rentabilidad atrae capital profesional."},{"id":"E060","de":"F05","a":"A01","p":"+","c":0,"h":1,"q":0,"r":2,"m":"Parte de lo que se compra para invertir se pone en alquiler."},{"id":"E061","de":"S02","a":"S01","p":"-","c":2,"h":0,"q":0,"r":5,"m":"Cuanto más tarda la tramitación, menos suelo llega a estar listo."},{"id":"E062","de":"S01","a":"P01","p":"+","c":2,"h":0,"q":0,"r":2,"m":"Sin suelo listo no se puede iniciar obra."},{"id":"E063","de":"S01","a":"B01","p":"-","c":1,"h":0,"q":0,"r":5,"m":"Donde hay más suelo listo para edificar, los precios suben menos."},{"id":"E064","de":"S01","a":"A02","p":"-","c":1,"h":0,"q":0,"r":5,"m":"Donde hay más suelo listo para edificar, los alquileres suben menos."},{"id":"E065","de":"S05","a":"G02","p":"+","c":0,"h":0,"q":0,"r":5,"m":"La vivienda protegida necesita suelo barato o cedido."},{"id":"E066","de":"S02","a":"S03","p":"+","c":1,"h":0,"q":0,"r":5,"m":"El suelo clasificado se acumula sin transformar."},{"id":"E067","de":"F04","a":"S03","p":"+","c":0,"h":0,"q":0,"r":2,"m":"Si se espera que el suelo valga más, compensa esperar para desarrollarlo."},{"id":"E068","de":"S06","a":"S02","p":"-","c":1,"h":0,"q":0,"r":5,"m":"Con reglas estables, los planes no se anulan ni se repiten."},{"id":"E069","de":"S01","a":"S04","p":"-","c":0,"h":1,"q":0,"r":2,"m":"Cuanto menos suelo listo hay, más caro es."},{"id":"E070","de":"B01","a":"S04","p":"+","c":0,"h":0,"q":0,"r":2,"m":"El suelo vale lo que permite ganar la vivienda que se construye encima."},{"id":"E071","de":"M03","a":"S01","p":"-","c":0,"h":1,"q":0,"r":5,"m":"Los propietarios, que son mayoría, tienden a oponerse a nuevos desarrollos cerca de su vivienda."},{"id":"E072","de":"B01","a":"P01","p":"+","c":2,"h":0,"q":0,"r":2,"m":"Con precios más altos compensa construir más."},{"id":"E073","de":"P03","a":"P01","p":"-","c":1,"h":0,"q":0,"r":2,"m":"Con costes más altos se inician menos promociones."},{"id":"E074","de":"P04","a":"P01","p":"+","c":2,"h":0,"q":0,"r":2,"m":"Sin trabajadores no se puede iniciar ni terminar obra."},{"id":"E075","de":"P04","a":"P03","p":"-","c":1,"h":0,"q":0,"r":0.5,"m":"Cuando faltan trabajadores, suben los salarios del sector."},{"id":"E076","de":"P01","a":"P02","p":"+","c":3,"h":0,"q":0,"r":2,"m":"Lo que se inicia se termina unos dos años después."},{"id":"E077","de":"P02","a":"A02","p":"-","c":1,"h":0,"q":0,"r":2,"m":"La vivienda nueva libera otras por cadenas de mudanzas y alivia el alquiler."},{"id":"E078","de":"P06","a":"P03","p":"+","c":0,"h":0,"q":0,"r":2,"m":"Cada requisito técnico añade coste por metro."},{"id":"E079","de":"P09","a":"P01","p":"+","c":2,"h":0,"q":0,"r":2,"m":"Sin capital no se puede comprar suelo ni empezar obra."},{"id":"E080","de":"P03","a":"P10","p":"+","c":0,"h":0,"q":0,"r":2,"m":"Con costes altos solo sale rentable construir caro."},{"id":"E081","de":"F06","a":"P10","p":"+","c":0,"h":0,"q":0,"r":2,"m":"La demanda extranjera de renta alta orienta la promoción hacia ese segmento."},{"id":"E082","de":"P10","a":"B01","p":"+","c":0,"h":0,"q":1,"r":2,"m":"Si lo nuevo es caro, no alivia el precio del resto."},{"id":"E083","de":"L06","a":"B01","p":"+","c":1,"h":0,"q":0,"r":0.5,"m":"Los impuestos se trasladan al precio final."},{"id":"E084","de":"P08","a":"Q03","p":"-","c":0,"h":0,"q":0,"r":2,"m":"Rehabilitar devuelve al uso viviendas que no lo tenían."},{"id":"E085","de":"Q09","a":"Q03","p":"-","c":1,"h":0,"q":0,"r":5,"m":"Lo que está en mal estado o no se adapta se queda vacío."},{"id":"E086","de":"P05","a":"P03","p":"-","c":1,"h":0,"q":0,"r":5,"m":"Más producción por hora, menos coste por vivienda."},{"id":"E087","de":"D02","a":"P04","p":"+","c":1,"h":0,"q":0,"r":2,"m":"Parte de quienes llegan trabaja en la construcción."},{"id":"E088","de":"L03","a":"Q05","p":"-","c":2,"h":0,"q":0,"r":2,"m":"Menos licencias, menos viviendas turísticas."},{"id":"E089","de":"Q05","a":"A02","p":"+","c":2,"h":0,"q":1,"r":2,"m":"Las viviendas que pasan a uso turístico dejan de alquilarse a residentes y la renta sube."},{"id":"E090","de":"Q05","a":"B01","p":"+","c":3,"h":0,"q":0,"r":2,"m":"La rentabilidad turística se capitaliza en el precio de compra."},{"id":"E091","de":"Q05","a":"A01","p":"-","c":2,"h":0,"q":1,"r":2,"m":"Cada vivienda turística es una vivienda menos para residentes."},{"id":"E092","de":"Q05","a":"O08","p":"+","c":3,"h":0,"q":0,"r":2,"m":"Los edificios se llenan de visitantes y los residentes se van."},{"id":"E093","de":"Q05","a":"Q11","p":"-","c":1,"h":0,"q":0,"r":0.5,"m":"Con menos viviendas turísticas hay menos plazas y el alojamiento se encarece."},{"id":"E094","de":"L01","a":"Q06","p":"+","c":2,"h":0,"q":0,"r":0.5,"m":"Con el alquiler habitual topado, los contratos se desvían a temporada y habitaciones."},{"id":"E095","de":"L01","a":"Q05","p":"+","c":0,"h":0,"q":0,"r":2,"m":"Con el alquiler habitual topado, parte de la oferta se desvía a uso turístico."},{"id":"E096","de":"Q06","a":"A01","p":"-","c":1,"h":0,"q":0,"r":0.5,"m":"Lo que se alquila por temporada o habitaciones sale del alquiler habitual."},{"id":"E097","de":"F06","a":"Q07","p":"+","c":1,"h":0,"q":0,"r":2,"m":"Los no residentes compran sobre todo segunda residencia."},{"id":"E098","de":"Q03","a":"A01","p":"-","c":1,"h":0,"q":0,"r":0,"m":"Una vivienda vacía donde hay demanda es oferta que no existe."},{"id":"E099","de":"L08","a":"Q03","p":"-","c":0,"h":0,"q":1,"r":2,"m":"Tener la vivienda vacía sale más caro."},{"id":"E100","de":"L13","a":"Q03","p":"-","c":1,"h":0,"q":0,"r":2, gar beneficiario paga de su bolsillo."},{"id":"E129","de":"L05","a":"B03","p":"+","c":1,"h":0,"q":0,"r":0.5,"m":"El aval público permite comprar sin tener la entrada."},{"id":"E130","de":"A11","a":"O04","p":"+","c":1,"h":0,"q":0,"r":0.5,"m":"Quien es rechazado acaba en vivienda peor o más cara."},{"id":"E131","de":"A09","a":"O04","p":"+","c":0,"h":1,"q":0,"r":0.5,"m":"Quien no cumple los requisitos se queda fuera del mercado formal."},{"id":"E132","de":"A09","a":"A11","p":"+","c":0,"h":1,"q":0,"r":0.5,"m":"Cuando el arrendador puede elegir, los perfiles discriminados son los primeros descartados."},{"id":"E133","de":"A02","a":"O08","p":"+","c":0,"h":1,"q":0,"r":2,"m":"Cuando la renta sube en la renovación, el hogar se va del barrio."},{"id":"E134","de":"G04","a":"G02","p":"+","c":1,"h":0,"q":0,"r":2,"m":"Con más presupuesto se promueve más vivienda protegida."},{"id":"E135","de":"G04","a":"G01","p":"+","c":1,"h":0,"q":0,"r":2,"m":"La inversión pública financia vivienda de alquiler social."},{"id":"E136","de":"G05","a":"G02","p":"+","c":1,"h":0,"q":0,"r":2,"m":"Si el módulo cubre el coste, promotores y cooperativas hacen protegida."},{"id":"E137","de":"P03","a":"G05","p":"-","c":1,"h":0,"q":0,"r":0.5,"m":"Con el precio máximo fijo, cada subida de costes se come el margen."},{"id":"E138","de":"G06","a":"G02","p":"+","c":2,"h":0,"q":0,"r":2,"m":"Lo presupuestado solo se convierte en vivienda si se licita y se ejecuta."},{"id":"E139","de":"G02","a":"G01","p":"+","c":3,"h":0,"q":0,"r":2,"m":"La vivienda protegida destinada a alquiler y con protección permanente entra en el parque social."},{"id":"E140","de":"G03","a":"G01","p":"-","c":3,"h":0,"q":0,"r":0,"m":"Cada vivienda descalificada sale del parque asequible."},{"id":"E141","de":"G01","a":"O01","p":"-","c":2,"h":0,"q":0,"r":0,"m":"Quien accede a alquiler social paga menos."},{"id":"E142","de":"G01","a":"A03","p":"-","c":0,"h":1,"q":0,"r":2,"m":"Cada hogar alojado en vivienda social deja de competir en el mercado."},{"id":"E143","de":"O01","a":"M01","p":"+","c":1,"h":0,"q":0,"r":2,"m":"Cuando el alquiler ahoga a muchos hogares, la vivienda sube entre las preocupaciones."},{"id":"E144","de":"O03","a":"M01","p":"+","c":0,"h":1,"q":0,"r":2,"m":"Una generación que no puede emanciparse se moviliza."},{"id":"E145","de":"O04","a":"M01","p":"+","c":0,"h":1,"q":0,"r":0.5,"m":"Los desahucios visibles movilizan."},{"id":"E146","de":"O08","a":"M01","p":"+","c":0,"h":1,"q":0,"r":2,"m":"La expulsión de residentes genera protesta vecinal."},{"id":"E147","de":"M01","a":"L01","p":"+","c":0,"h":1,"q":0,"r":2,"m":"La presión social empuja a regular precios."},{"id":"E148","de":"M01","a":"L02","p":"+","c":0,"h":1,"q":0,"r":0.5,"m":"La presión social empuja a proteger frente al desahucio."},{"id":"E149","de":"M01","a":"L03","p":"+","c":0,"h":1,"q":0,"r":2,"m":"La presión vecinal empuja a restringir el alquiler turístico."},{"id":"E150","de":"M01","a":"L05","p":"+","c":0,"h":1,"q":0,"r":0.5,"m":"La ayuda directa es la respuesta más rápida y visible."},{"id":"E151","de":"M01","a":"G04","p":"+","c":0,"h":1,"q":0,"r":2,"m":"La presión social empuja a anunciar inversión en vivienda pública."},{"id":"E152","de":"M01","a":"L09","p":"+","c":0,"h":1,"q":0,"r":2,"m":"La presión empuja a cerrar las vías de escape de la regulación."},{"id":"E153","de":"M01","a":"M02","p":"+","c":0,"h":1,"q":0,"r":2,"m":"Cuanto más pesa el problema, más rentable es políticamente diferenciarse en el diagnóstico."},{"id":"E154","de":"M01","a":"L10","p":"+","c":0,"h":1,"q":0,"r":0.5,"m":"Cada pico de presión produce un nuevo decreto."},{"id":"E155","de":"M02","a":"L10","p":"+","c":0,"h":1,"q":0,"r":2,"m":"Cada cambio de mayoría revierte o modifica las reglas del anterior."},{"id":"E156","de":"M02","a":"S06","p":"-","c":0,"h":1,"q":0,"r":5,"m":"Sin acuerdo entre bloques, las reformas de fondo no salen."},{"id":"E157","de":"M03","a":"M01","p":"-","c":0,"h":1,"q":0,"r":5,"m":"Mientras la mayoría es propietaria, la subida de precios beneficia a más votantes de los que perjudica."},{"id":"E158","de":"T01","a":"Q12","p":"+","c":1,"h":0,"q":0,"r":2,"m":"Más visitantes para un número parecido de viviendas: cada vivienda turística se ocupa más noches."},{"id":"E159","de":"Q12","a":"Q05","p":"+","c":2,"h":0,"q":0,"r":2,"m":"Si el uso turístico rinde más que el alquiler habitual, más viviendas pasan a él."},{"id":"E160","de":"Q13","a":"Q05","p":"+","c":3,"h":0,"q":0,"r":0,"m":"Cada vivienda vacía o heredada que se anuncia como turística se suma al parque turístico."},{"id":"E161","de":"Q14","a":"Q05","p":"+","c":3,"h":0,"q":0,"r":0,"m":"Cada alquiler habitual que pasa a turístico se suma al parque turístico."},{"id":"E162","de":"Q14","a":"A01","p":"-","c":3,"h":0,"q":0,"r":0,"m":"Cada alquiler habitual que pasa a turístico sale de la oferta para residentes."},{"id":"E163","de":"Q14","a":"O09","p":"+","c":3,"h":0,"q":0,"r":0,"m":"El inquilino al que no se renueva para cambiar el uso tiene que irse."},{"id":"E164","de":"Q12","a":"Q13","p":"+","c":0,"h":1,"q":0,"r":2,"m":"Quien hereda o tiene una vivienda vacía la anuncia como turística si rinde más que venderla o alquilarla."},{"id":"E165","de":"Q12","a":"Q14","p":"+","c":0,"h":1,"q":0,"r":2,"m":"El propietario no renueva al inquilino para pasar la vivienda a uso turístico."},{"id":"E166","de":"Q12","a":"Q15","p":"+","c":0,"h":1,"q":0,"r":2,"m":"Los inversores compran edificios enteros donde el cambio de uso rinde más."},{"id":"E167","de":"Q15","a":"O09","p":"+","c":2,"h":0,"q":0,"r":2,"m":"Quien compra el edificio entero no renueva los contratos para vaciarlo."},{"id":"E168","de":"L01","a":"Q15","p":"-","c":1,"h":0,"q":0,"r":2,"m":"Con la renta topada, comprar un edificio para subir los alquileres rinde menos."},{"id":"E169","de":"A02","a":"O09","p":"+","c":1,"h":0,"q":0,"r":2,"m":"Cuando la renta sube más de lo que el hogar puede pagar, se va sin que haya juicio."},{"id":"E170","de":"L02","a":"O09","p":"-","c":1,"h":0,"q":0,"r":2,"m":"Contratos más largos y prórrogas obligatorias dejan menos ocasiones de no renovar."},{"id":"E171","de":"O09","a":"O04","p":"+","c":0,"h":1,"q":0,"r":2,"m":"Quien es expulsado sin alternativa acaba en vivienda peor, hacinado o sin hogar."},{"id":"E172","de":"L15","a":"G01","p":"+","c":1,"h":0,"q":0,"r":2,"m":"Cada vivienda adquirida por tanteo y retracto pasa al parque público."},{"id":"E173","de":"L15","a":"O09","p":"-","c":0,"h":1,"q":0,"r":0,"m":"Si la Administración compra el edificio, los inquilinos se quedan."},{"id":"E174","de":"L16","a":"F10","p":"-","c":1,"h":0,"q":0,"r":2,"m":"Si se limita comprar vivienda existente como inversión, los inversores compran menos."},{"id":"E175","de":"F10","a":"B01","p":"+","c":2,"h":0,"q":0,"r":2,"m":"La demanda de los inversores institucionales se suma a la de los hogares."},{"id":"E176","de":"F10","a":"A02","p":"+","c":2,"h":0,"q":0,"r":2,"m":"Los propietarios institucionales suben la renta de las viviendas que compran más que otros caseros."},{"id":"E177","de":"L03","a":"Q06","p":"+","c":1,"h":0,"q":0,"r":2,"m":"Las viviendas que dejan el uso turístico se desvían al alquiler de temporada."},{"id":"E178","de":"L09","a":"Q06","p":"-","c":1,"h":0,"q":0,"r":0.5,"m":"Si la temporada también se regula, deja de ser una vía de escape."},{"id":"E179","de":"Q15","a":"O04","p":"+","c":0,"h":1,"q":0,"r":2,"m":"Los inquilinos de un edificio comprado por un inversor acaban desahuciados por vía judicial."},{"id":"E180","de":"F10","a":"Q05","p":"+","c":0,"h":1,"q":0,"r":2,"m":"Fondos y socimis destinan las viviendas que compran a alojamiento turístico."},{"id":"E181","de":"Q15","a":"Q05","p":"+","c":2,"h":0,"q":0,"r":2,"m":"Parte de los edificios comprados en bloque se destina a alojamiento turístico."},{"id":"E182","de":"Q15","a":"Q06","p":"+","c":1,"h":0,"q":0,"r":2,"m":"Parte de los edificios comprados pasa a alquiler de temporada, por habitaciones o a residencias compartidas."},{"id":"E183","de":"F10","a":"O09","p":"+","c":1,"h":0,"q":0,"r":2,"m":"Tras la compra: contratos cortos, no renovación y sustitución de inquilinos."},{"id":"E184","de":"A02","a":"A12","p":"+","c":1,"h":0,"q":0,"r":2,"m":"Cuando alquilar un piso entero es inasequible, se alquila una habitación."},{"id":"E185","de":"A12","a":"O10","p":"+","c":1,"h":0,"q":0,"r":2,"m":"Más personas adultas sin parentesco en la misma vivienda."},{"id":"E186","de":"A12","a":"O01","p":"-","c":1,"h":0,"q":0,"r":2,"m":"Quien comparte paga solo su habitación, y su esfuerzo medido baja."},{"id":"E187","de":"L09","a":"A12","p":"-","c":0,"h":1,"q":0,"r":2,"m":"Limitar la suma de las rentas de las habitaciones a la del piso entero quita el incentivo a trocear la vivienda."},{"id":"E188","de":"A01","a":"A13","p":"-","c":0,"h":1,"q":0,"r":2,"m":"Cuanta menos oferta, más se paga por lo que sale al mercado."},{"id":"E189","de":"A13","a":"D07","p":"+","c":1,"h":0,"q":0,"r":2,"m":"Si entrar cuesta mucho más que quedarse, quien no tiene contrato no llega a formar hogar."},{"id":"E190","de":"R03","a":"D02","p":"+","c":2,"h":0,"q":0,"r":2,"m":"Donde se crea empleo, llega población de fuera."},{"id":"E191","de":"D02","a":"D03","p":"+","c":1,"h":0,"q":0,"r":0.5,"m":"Quienes llegan forman hogares nuevos."},{"id":"E192","de":"D02","a":"A03","p":"+","c":1,"h":0,"q":0,"r":0.5,"m":"Quien llega vive sobre todo de alquiler."},{"id":"E193","de":"D02","a":"O10","p":"+","c":1,"h":0,"q":0,"r":2,"m":"Quien llega con ingresos bajos absorbe el coste del alquiler compartiendo vivienda."},{"id":"E194","de":"D03","a":"D07","p":"-","c":3,"h":0,"q":0,"r":0,"m":"Cada hogar que se forma es un hogar menos que se queda sin formar."},{"id":"E195","de":"G01","a":"O04","p":"-","c":1,"h":0,"q":0,"r":0,"m":"Un hogar en exclusión que accede a una vivienda social estable deja de estarlo."},{"id":"E196","de":"L07","a":"F10","p":"+","c":1,"h":0,"q":0,"r":2,"m":"El régimen fiscal de las sociedades de inversión favorece también la compra de vivienda ya construida."},{"id":"E197","de":"F10","a":"A01","p":"+","c":0,"h":0,"q":1,"r":2,"m":"La vivienda que compra un inversor para alquilar entra en la oferta de alquiler; si se le impide, la compra un hogar para vivir en ella."}],"resultados":[{"dimension":"Hogares que alquilan para vivir","variables":[["O01","baja"],["A02","baja"],["A01","sube"],["A09","baja"],["O08","baja"],["O09","baja"],["O10","baja"]]},{"dimension":"Jóvenes y hogares que quieren comprar","variables":[["O03","baja"],["O02","baja"],["B01","baja"],["D07","baja"]]},{"dimension":"Personas vulnerables","variables":[["O04","baja"],["G01","sube"],["A11","baja"]]},{"dimension":"Propietarios que alquilan","variables":[["A04","baja"],["F08","sube"]]},{"dimension":"Promotores y constructores","variables":[["P01","sube"],["P02","sube"]]},{"dimension":"Turistas","variables":[["Q05","sube"],["Q11","baja"]]},{"dimension":"Estudiantes y residentes temporales","variables":[["Q06","sube"]]},{"dimension":"Conjunto de la sociedad","variables":[["Q08","baja"],["O05","baja"]]}],"escenarios":[{"id":"E1","nombre":"Recuperar para residentes los pisos turísticos","fija":{"L03":1},"propia":true,"lectura":"Retirar la licencia a las viviendas turísticas que antes fueron alquiler habitual. En el mapa equivale a aumentar la restricción al alquiler turístico: el mapa no distingue la restricción selectiva de la general, que difieren en tamaño y en riesgo legal, no en sentido.","supuesto":"Ninguno añadido: la medida actúa sobre una variable de decisión que ya está en el mapa.","magnitud":"341.001 viviendas turísticas en mayo de 2026, el 1,28 % del parque (INE). Muy concentradas: Marbella 6,97 %, Málaga 3,17 %, Sevilla 2,12 %, Barcelona 1,02 %, Madrid 0,71 %. El déficit acumulado es de unas 750.000 viviendas (Banco de España). Estudio de Barcelona: efecto medio sobre los alquileres cercano al 2 %, y de unos 7 puntos en los barrios más turísticos."},{"id":"E2","nombre":"Impedir que los fondos compren edificios enteros para uso turístico","fija":{"Q05":-1,"F07":-1},"propia":true,"lectura":"Se representa por sus dos efectos directos: menos viviendas de uso turístico y menos capital institucional en vivienda.","supuesto":"Que la medida reduce de verdad ambas cosas. No se ha localizado ninguna afirmación ni dato sobre cuántos edificios se compran para ese fin, así que el tamaño del efecto es desconocido.","magnitud":"No existe ninguna cifra de edificios residenciales completos convertidos en Madrid, Valencia, Sevilla, Palma o San Sebastián. Málaga: los edificios de apartamentos turísticos pasan de 228 en 2022 a 354 a comienzos de 2026 (visto en prensa; no dice cuántos eran residenciales). Barcelona: 13 licencias de edificios enteros, con 783 plazas. El capital institucional ronda las 110.000 viviendas en alquiler, cerca del 5 % de la oferta (estimación de una consultora del sector)."},{"id":"E3","nombre":"Proteger del impago al pequeño propietario","fija":{"L13":1},"propia":true,"lectura":"Garantía pública de cobro para los propietarios que no son grandes tenedores. Ya es una variable del mapa, porque existen programas así y uno está evaluado.","supuesto":"Ninguno añadido. La evidencia distingue dos diseños: cuando la Administración paga la renta al propietario, capta vivienda; cuando solo ofrece un seguro de impago, apenas.","magnitud":"País Vasco: el programa que paga la renta (Bizigune) tenía 7.375 viviendas a cierre de 2024, a unos 4.850 € por vivienda y año; el que solo asegura el impago (ASAP) captó 278, el 35 % de su objetivo. Las ciudades de más de 250.000 habitantes tienen 403.073 viviendas vacías, el 7,5 % de su parque (INE, Censo de 2021). El 76 % de los arrendadores teme no cobrar, y el 76 % no ha tenido problemas con su inquilino en cinco años (OCU, 2023)."},{"id":"E4","nombre":"Dotar a ayuntamientos y comunidades para alojar en el propio barrio","fija":{"G01":1},"propia":true,"lectura":"Presupuesto finalista para que las administraciones cercanas compren, alquilen o rehabiliten viviendas y alojen a las personas vulnerables donde ya viven. Se representa por su resultado: crece el parque de alquiler social.","supuesto":"Que la dotación se convierte en viviendas disponibles, lo que depende de la capacidad de ejecución de la Administración. El mapa no distingue el barrio: no puede decir nada sobre el arraigo.","magnitud":"El parque de alquiler social ronda las 290.000 viviendas, el 1,5 % de las principales; converger con la media europea exigiría cerca de 1,5 millones más (Banco de España). En 2025 se calificaron 12.858 viviendas protegidas (Ministerio de Vivienda)."},{"id":"E5","nombre":"Paquete: E1 + E3 + E4","fija":{"L03":1,"L13":1,"G01":1},"propia":true,"lectura":"Las tres medidas anteriores aplicadas a la vez.","supuesto":"El de E4.","magnitud":""},{"id":"E6","nombre":"El mismo paquete con reglas estables","fija":{"L03":1,"L13":1,"G01":1,"L10":-1},"propia":true,"lectura":"El paquete E5 acompañado de un compromiso de no cambiar las reglas del alquiler durante un periodo largo.","supuesto":"El de E4.","magnitud":""},{"id":"R1","nombre":"Referencia: topar el alquiler","fija":{"L01":1},"lectura":"Ampliar las zonas con tope al precio del alquiler habitual.","supuesto":"Ninguno.","magnitud":""},{"id":"R2","nombre":"Referencia: ayudas a la demanda","fija":{"L05":1},"lectura":"Más bono de alquiler y más avales a la compra.","supuesto":"Ninguno.","magnitud":""},{"id":"R3","nombre":"Referencia: invertir en vivienda protegida","fija":{"G04":1},"lectura":"Más inversión pública en promover vivienda protegida.","supuesto":"Ninguno.","magnitud":""},{"id":"R4","nombre":"Referencia: agilizar el suelo","fija":{"S02":-1},"lectura":"Reducir los plazos de tramitación urbanística.","supuesto":"Ninguno.","magnitud":""},{"id":"E7","nombre":"Frenar la conversión turística y la compra inversora, proteger frente a la expulsión y contener el alquiler","fija":{"L03":1,"L09":1,"L16":1,"L07":-1,"L02":1,"L01":1,"L15":1},"propia":true,"lectura":"El paquete que plantea el autor: restringir las viviendas turísticas, regular también el alquiler de temporada para que no sirva de escape, limitar la compra de vivienda por inversores y retirar las ventajas fiscales de socimis y fondos, reforzar la protección del inquilino frente a la no renovación y el desahucio, ampliar las zonas con tope al alquiler y usar la compra preferente de la Administración cuando se vende un edificio.","supuesto":"Ninguno añadido: las siete son variables de decisión del mapa. El mapa no puede dirigir cada medida a una de las tres vías de conversión (vivienda vacía o heredada, alquiler no renovado, edificio vendido a un inversor), porque ninguna de las tres está medida.","magnitud":"341.001 viviendas turísticas en mayo de 2026, un 10,7 % menos que un año antes (INE). En Barcelona, 149 compraventas de edificios enteros en 2025, frente a 217 en 2024. Cataluña adquirió 662 viviendas por tanteo y retracto en 2024, por 49,9 millones de euros. En Madrid y Barcelona, cerca del 31 % de las últimas mudanzas de inquilinos fueron forzosas y solo el 1,5 % por orden judicial (IDRA, encuesta no probabilística). Se inscriben unas 208.000 herencias de vivienda al año, sin dato de su uso posterior."},{"id":"E8","nombre":"El mismo paquete, con vivienda pública y suelo","fija":{"L03":1,"L09":1,"L16":1,"L07":-1,"L02":1,"L01":1,"L15":1,"G04":1,"S02":-1},"propia":true,"lectura":"El paquete E7 acompañado de más inversión pública en vivienda protegida y de plazos urbanísticos más cortos, para actuar también sobre la falta de construcción.","supuesto":"Que una reforma administrativa acorta de verdad los plazos.","magnitud":"En 2025 se iniciaron 137.330 viviendas y se calificaron 12.858 protegidas (Ministerio de Vivienda); el déficit acumulado ronda las 750.000 (Banco de España). La inversión pública en vivienda es el 0,2 % del PIB (Eurostat, 2024)."},{"id":"P1","nombre":"Paquete P1: Sin perdedores","fija":{"L04":1,"S02":-1},"lectura":"Paquete elegido por cálculo entre todas las combinaciones de palancas. Entre los paquetes que mejoran al menos un resultado: primero, el menor número de actores con algún resultado que empeora en primera ronda; después, menos resultados que empeoran; menos con señales contrarias; menos mejoras con efectos de vuelta en contra; más resultados que mejoran; menos medidas; y, si aún hay empate, mejor saldo con evidencia media o alta. Con todas las relaciones que tienen apoyo.","supuesto":"que una reforma administrativa acorta de verdad los plazos"},{"id":"P2","nombre":"Paquete P2: Solo evidencia firme","fija":{"F03":1,"S02":-1},"lectura":"Paquete elegido por cálculo entre todas las combinaciones de palancas. Usando solo relaciones de confianza media o alta: ningún resultado que empeore ni con señales contrarias en primera ronda; después, el mayor número de resultados que mejoran y menos efectos de vuelta en contra; para desempatar, menos perjuicios al añadir la evidencia débil y menos medidas.","supuesto":"que una reforma administrativa acorta de verdad los plazos"},{"id":"P3","nombre":"Paquete P3: Más actores beneficiados","fija":{"L01":-1,"G01":1,"L16":1},"lectura":"Paquete elegido por cálculo entre todas las combinaciones de palancas. El mayor número de actores con algún resultado que mejora en primera ronda, aunque otros empeoren; después, menos actores con resultados que empeoran; menos resultados que empeoran; menos con señales contrarias; más resultados que mejoran; menos efectos de vuelta en contra; menos medidas. Con todas las relaciones que tienen apoyo.","supuesto":"que la dotación se convierte en viviendas de alquiler social"},{"id":"P4","nombre":"Paquete P4: Menor coste social","fija":{"L03":1,"L10":-1,"L15":1},"lectura":"Paquete elegido por cálculo entre todas las combinaciones de palancas. Solo cuentan los resultados que describen cómo viven las personas; la rentabilidad de quien ofrece no puntúa ni penaliza. Primero, el mayor saldo entre resultados sociales que mejoran y que empeoran en primera ronda; después, menos resultados sociales que empeoran; menos con señales contrarias; menos mejoras con efectos de vuelta en contra; mayor saldo usando solo evidencia media o alta; menos medidas.","supuesto":"que el pacto se cumple"},{"id":"P5","nombre":"Paquete P5: Más personas beneficiadas","fija":{"L04":1,"F03":1,"L15":1},"lectura":"Paquete elegido por cálculo entre todas las combinaciones de palancas. Se pondera por personas: cada grupo de población recibe una nota entre −1 y +1 según cuántos de sus resultados mejoran y empeoran en primera ronda, y se promedia con el número de personas de cada grupo. Gana el índice más alto; después, el más alto con evidencia media o alta; menos resultados sociales que empeoran; menos medidas. Es una simulación con una convención declarada.","supuesto":"Ninguno."},{"id":"P4I","nombre":"Paquete P4I: Menor coste social, solo intervención","fija":{"F03":1,"L13":1},"lectura":"Paquete elegido por cálculo entre todas las combinaciones de palancas. La misma regla, eligiendo solo entre medidas que intervienen el mercado. Solo cuentan los resultados que describen cómo viven las personas; la rentabilidad de quien ofrece no puntúa ni penaliza. Primero, el mayor saldo entre resultados sociales que mejoran y que empeoran en primera ronda; después, menos resultados sociales que empeoran; menos con señales contrarias; menos mejoras con efectos de vuelta en contra; mayor saldo usando solo evidencia media o alta; menos medidas.","supuesto":"Ninguno."},{"id":"P4M","nombre":"Paquete P4M: Menor coste social, solo mercado","fija":{"L04":1,"S02":-1},"lectura":"Paquete elegido por cálculo entre todas las combinaciones de palancas. La misma regla, eligiendo solo entre medidas que dejan actuar a la oferta y la demanda. Solo cuentan los resultados que describen cómo viven las personas; la rentabilidad de quien ofrece no puntúa ni penaliza. Primero, el mayor saldo entre resultados sociales que mejoran y que empeoran en primera ronda; después, menos resultados sociales que empeoran; menos con señales contrarias; menos mejoras con efecto (function () {
  const NS = 'http://www.w3.org/2000/svg';

  // ---- Calculo: todos los caminos simples de hasta PROF relaciones desde cada variable fijada.

  function simular() {
    res = new Map(); ronda = new Map();

    for (const [o, s0] of fijo) {
      if (!s0) continue;

        for (const a of (ady[v] || [])) {
          if (fijo.has(a.a) || vis.has(a.a)) continue;
          const s = signo * (a.p === '+' ? 1 : -1), r = ret + a.r, c = Math.min(conf, a.c), h = r < 1 ? 0 : r <= 4 ? 1 : 2;
          const k = celda(a.a)[h]; s > 0 ? k.pos++ : k.neg++;
          const ids = [...rastro, a.id];
          const q = ronda.get(a.a) || { l: Infinity, p: 0, n: 0, P: 0, N: 0 }; ronda.set(a.a, q);
          if (ids.length < q.l) { q.P += q.p; q.N += q.n; q.l = ids.length; q.p = 0; q.n = 0; }
          if (ids.length === q.l) { s > 0 ? q.p++ : q.n++; } else { s > 0 ? q.P++ : q.N++; }
          if (k.cam.length < 80) k.cam.push({ o, s0, s, r, c, ids });
          if (ids.length < PROF) { vis.add(a.a); dfs(a.a, s, r, c, ids); vis.delete(a.a); }
        }
      })(o, s0, 0, 3, []);
    }
  }

    return { pos, neg, s: !pos && !neg ? null : pos && neg ? 0 : pos ? 1 : -1 };
  }

  // ---- Columna izquierda: palancas
  const izq = document.getElementById('izq');
  function filaVar(id) {

  }
  function pintarIzq() {
    const dec = DATOS.nodos.filter(n => n.t === 'decision').map(n => n.id), exo = DATOS.nodos.filter(n => n.t === 'exogena').map(n => n.id);
    const otras = [...fijo.keys()].filter(id => !dec.includes(id) && !exo.includes(id));
    izq.innerHTML = '<h2>1. Elige qué cambia</h2><h3>Escenarios de partida</h3>' + DATOS.escenarios.map((s, i) => `<button class="esc" data-e="${i}">${esc(s.nombre)}</button>`).join('') +
      '<button class="esc" data-e="-1" style="border-color:#C05621;color:#C05621">Limpiar</button>' +
      (escActivo !== null ? `<div class="aviso" style="background:#EAF2F8;border-color:#1F5A8A"><b>${esc(DATOS.escenarios[escActivo].nombre)}</b><br>${esc(DATOS.escenarios[escActivo].lectura || '')}${DATOS.escenarios[escActivo].supuesto ? '<br><b>Supuesto:</b> ' + esc(DATOS.escenarios[escActivo].supuesto) : ''}</div>` : '') +
      '<h3>Decisiones de administraciones y banca</h3>' + dec.map(filaVar).join('') +
      '<h3>Condiciones externas</h3>' + exo.map(filaVar).join('') +
      '<h3>Cualquier otra variable</h3>' + otras.map(filaVar).join('') +
      '<select id="otra"><option value="">Añadir variable…</option>' + DATOS.nodos.filter(n => !dec.includes(n.id) && !exo.includes(n.id) && !fijo.has(n.id)).sort((a, b) => a.n.localeCompare(b.n, 'es')).map(n => `<option value="${n.id}">${esc(n.n)}</option>`).join('') + '</select>' +
      '<h3>Relaciones que se usan</h3><select id="conf"><option value="1">Confianza baja o superior (sin conjeturas)</option><option value="2">Solo confianza media o alta</option><option value="3">Solo confianza alta</option><option value="0">Añadir conjeturas (una sola afirmación, sin datos)</option><option value="-1">Añadir también hipótesis del analista (sin fuente)</option></select>' +
      '<div class="aviso">«Se mantiene» significa que la variable no cambia: corta los efectos que pasarían por ella. Sirve para preguntar, por ejemplo, qué ocurre si se regula el precio <i>y</i> la oferta de alquiler no cae.</div>';
    document.getElementById('conf').value = String(minConf);
    izq.querySelectorAll('.bt').forEach(b => b.addEventListener('click', () => { const id = b.dataset.id, v = +b.dataset.v; fijo.get(id) === v ? fijo.delete(id) : fijo.set(id, v); todo(); }));
    izq.querySelectorAll('.esc').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.e; fijo.clear(); escActivo = i >= 0 ? i : null; if (i >= 0) for (const [k, v] of Object.entries(DATOS.escenarios[i].fija)) fijo.set(k, v); detalle = null; todo(); }));

    document.getElementById('conf').addEventListener('change', ev => { minConf = +ev.target.value; todo(); });
  }

  // ---- Columna derecha: resultados por dimension y plazo
  const der = document.getElementById('der');
  let detalle = null;   // { id, h }
  function clase(s, mejorSi) { if (s === null) return 'nul'; if (s === 0) return 'mix'; return (s > 0) === (mejorSi === 'sube') ? 'mej' : 'emp'; }
  function txt(v) { return v.s === null ? '·' : v.s === 0 ? `◆ ${v.pos}▲ ${v.neg}▼` : `${fl(v.s)} ${v.pos + v.neg}`; }
  function pintarDer() {
    let h = '<h2>2. Qué empuja a qué</h2>';

    for (const g of DATOS.resultados) {

        for (const k of [0, 1, 2, 3]) { const v = fijo.has(id) ? { s: null } : veredicto(id, k); h += `<td class="c ${clase(v.s, mejor)}" data-id="${id}" data-h="${k}">${fijo.has(id) ? 'fijada' : txt(v)}</td>`; }
        const q = fijo.has(id) ? null : ronda.get(id);

        h += '</tr>';

    h += '</table><p class="obs"><span class="mej">Verde</span>: todas las vías empujan hacia la mejora. <span class="emp">Naranja</span>: todas empujan hacia el empeoramiento. <span class="mix">Morado ◆</span>: hay vías en los dos sentidos y el resultado depende de magnitudes que el mapa no contiene. El número es la cantidad de vías. Pulsa una celda para verlas.</p><p class="obs"><b>Primera ronda</b>: el veredicto de las vías más cortas, las que llegan con menos pasos. <b>Efectos de vuelta</b>: las vías más largas, que rodean o realimentan, contadas según favorezcan o no lo que le conviene al actor. Es una convención: la primera ronda llega antes, pero el mapa no dice si pesa más.</p><div id="det"></div>';

    pintarDetalle();

  function pintarDetalle() {

  // ---- Centro: esquema de las variables clave con el resultado encima

  const el = (t, at, p) => { const e = document.createElementNS(NS, t); for (const k in at) e.setAttribute(k, at[k]); (p || svg).appendChild(e); return e; };
  const pos = DATOS.pos, RN = 13;
  const partir = s => { if (s.length <= 24) return [s]; const m = s.length / 2; let b = -1; for (let i = 0; i < s.length; i++) if (s[i] === ' ' && (b < 0 || Math.abs(i - m) < Math.abs(b - m))) b = i; return b < 0 ? [s] : [s.slice(0, b), s.slice(b + 1)]; };
  function pintarSvg() {
    svg.innerHTML = '';
    const defs = el('defs', {});
    [['mas', '#2B6CB0'], ['menos', '#C05621'], ['gris', '#BCCCDC']].forEach(([id, c]) => { const m = el('marker', { id: 'f-' + id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse' }, defs); el('path', { d: 'M0,0 L10,5 L0,10 z', fill: c }, m); });
    // relaciones activas: las que forman parte de alguna via hacia el resultado en detalle, o de cualquier via si no hay detalle
    const activas = new Set();
    const fuente = detalle && res.get(detalle.id) ? (detalle.h === 3 ? res.get(detalle.id) : [res.get(detalle.id)[detalle.h]]) : [...res.values()].flat();
    fuente.forEach(k => k.cam.forEach(c => c.ids.forEach(id => activas.add(id))));
    for (const a of DATOS.aristas) {

      const p = pos[a.de], q = pos[a.a], dx = q[0] - p[0], dy = q[1] - p[1], d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
      const x1 = p[0] + ux * (RN + 2), y1 = p[1] + uy * (RN + 2), x2 = q[0] - ux * (RN + 5), y2 = q[1] - uy * (RN + 5), mx = (x1 + x2) / 2 - dy * 0.16, my = (y1 + y2) / 2 + dx * 0.16;

    }

      const n = nodo[id], [x, y] = pos[id], f = fijo.has(id), v = f ? { s: fijo.get(id) } : veredicto(id, horizonte);

      `<select id="hor">${[...HOR, 'Conjunto de plazos'].map((x, i) => `<option value="${i}"${i === horizonte ? ' selected' : ''}>${x}</option>`).join('')}</select>`;

  }

  function todo() { simular(); pintarIzq(); pintarDer(); pintarSvg(); }
  const ini = new URLSearchParams(location.search).get('esc');
  if (ini !== null && DATOS.escenarios[+ini]) escActivo = +ini;
  if (ini !== null && DATOS.escenarios[+ini]) for (const [k, v] of Object.entries(DATOS.escenarios[+ini].fija)) fijo.set(k, v);
  todo();
})();
